<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 客服平台 · 生产架构（深色档）</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #0a0d1b;
      --color-ink:     #e0e4ff;
      --color-muted:   #a2a9ce;
      --color-accent:  #7d98ff;
      --font-sans:     'MiSans', 'Noto Sans SC', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif;
      --font-serif:    'Noto Serif SC', 'Songti SC', 'SimSun', serif;
      --font-mono:     'Sarasa Mono SC', 'Noto Sans SC', ui-monospace, 'SF Mono', Menlo, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; padding-left: 4%; }

    /* eyebrow */
    .eyebrow {
      font-family: var(--font-sans);
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.3em;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: 0;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; overflow: visible; }

<body>
  <div class="frame">
    <p class="eyebrow">架构图 · 深色档 · 图表设计</p>
    <h1>AI 客服平台 · 生产架构</h1>

    <svg viewBox="0 0 1000 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="example-architecture-dark-title example-architecture-dark-desc">
      <title id="example-architecture-dark-title">AI 客服平台生产架构</title>
      <desc id="example-architecture-dark-desc">架构图：用户网站请求经 API 网关进入对话 Agent（焦点），Agent 调用外部 LLM API、写入 Postgres 并读写 Redis 缓存。</desc>
        <defs>
          <!-- dots pattern: reserved for dev/editorial theme, unused by default -->
          <!--
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(224,228,255,0.10)"/>
          </pattern>
          -->
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#a2a9ce"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#0a0d1b"/>

        <!-- zone: core services -->
        <rect x="180" y="64" width="408" height="112" rx="8"
              fill="none" stroke="rgba(224,228,255,0.10)" stroke-width="0.8"/>
        <rect x="354" y="68" width="76" height="14" rx="2" fill="#0a0d1b"/>
        <text x="384" y="78" fill="rgba(224,228,255,0.40)" font-size="10" font-family="'Sarasa Mono SC', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.1em">生产环境</text>

        <!-- arrows (behind boxes) -->
        <line x1="128" y1="120" x2="208" y2="120" stroke="#a2a9ce" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="352" y1="128" x2="416" y2="128" stroke="#a2a9ce" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="576" y1="128" x2="668" y2="128" stroke="#a2a9ce" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- agent -> llm: top exit, elbow r=8 -->
        <path d="M 568,96 V 40 Q 568,32 576,32 H 716"
              fill="none" stroke="#a2a9ce" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- agent -> redis: dashed bypass -->
        <path d="M 568,160 V 208 Q 568,216 576,216 H 716"
              fill="none" stroke="#a2a9ce" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

        <!-- dashed return: gateway -> user -->
        <line x1="208" y1="144" x2="128" y2="144" stroke="#a2a9ce" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

        <!-- arrow labels -->
        <rect x="132" y="100" width="48" height="12" rx="2" fill="#0a0d1b"/>
        <text x="156" y="109" fill="#a2a9ce" font-size="8" font-family="'Sarasa Mono SC', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">HTTPS</text>

        <rect x="136" y="152" width="32" height="12" rx="2" fill="#0a0d1b"/>
        <text x="152" y="162" fill="#a2a9ce" font-size="10" font-family="'Sarasa Mono SC', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">应答</text>

        <rect x="604" y="108" width="44" height="12" rx="2" fill="#0a0d1b"/>
        <text x="622" y="118" fill="#a2a9ce" font-size="10" font-family="'Sarasa Mono SC', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">写入</text>

        <rect x="588" y="12" width="32" height="12" rx="2" fill="#0a0d1b"/>
        <text x="604" y="22" fill="#a2a9ce" font-size="10" font-family="'Sarasa Mono SC', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">补全</text>

        <rect x="578" y="196" width="52" height="12" rx="2" fill="#0a0d1b"/>
        <text x="604" y="206" fill="#a2a9ce" font-size="10" font-family="'Sarasa Mono SC', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">缓存读写</text>
