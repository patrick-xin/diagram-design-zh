<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>线上告警处置 · 流程图</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #0a0d1b;
      --color-ink:     #e0e4ff;
      --color-muted:   #a2a9ce;
      --color-soft:    #8f94ab;
      --color-accent:  #7d98ff;
      --font-sans:     'MiSans', 'Noto Sans SC', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif;
      --font-serif:    'Noto Serif SC', 'Songti SC', 'SimSun', serif;
      --font-mono:     'Sarasa Mono SC', 'Noto Sans SC', ui-monospace, 'SF Mono', Menlo, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; padding-left: 4%; }

    .eyebrow {
      font-family: var(--font-sans);
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.3em;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: 0;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; overflow: visible; }

  <div class="frame">
    <p class="eyebrow">生产运维 · 流程图</p>
    <h1>线上告警怎么处置？</h1>

    <svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="example-flowchart-dark-title example-flowchart-dark-desc">
      <title id="example-flowchart-dark-title">线上告警怎么处置？（深色）</title>
      <desc id="example-flowchart-dark-desc">流程图：线上告警后值班确认影响面——核心链路受损且能在 30 分钟内修复时走热修验证（焦点主路径）；链路完好则观察跟进，短时间修不完则立即回滚。</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#a2a9ce"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#7d98ff"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#0a0d1b"/>

      <!-- 连接线（先画，全实线——流程图不用虚线） -->
      <line x1="500" y1="88" x2="500" y2="120" stroke="#a2a9ce" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="500" y1="168" x2="500" y2="192" stroke="#a2a9ce" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="600" y1="240" x2="720" y2="240" stroke="#a2a9ce" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="500" y1="288" x2="500" y2="328" stroke="#a2a9ce" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="600" y1="376" x2="720" y2="376" stroke="#a2a9ce" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- 主路径（accent）：判断 2 的「是」直下终点 -->
      <line x1="500" y1="424" x2="500" y2="464" stroke="#7d98ff" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <!-- 分支标签（白底遮罩骑线，断口居中于线段中点） -->
      <rect x="650" y="234" width="20" height="12" rx="2" fill="#0a0d1b"/>
      <text x="660" y="243" fill="#a2a9ce" font-size="10" font-weight="500" text-anchor="middle" font-family="'MiSans', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">否</text>

      <rect x="490" y="299" width="20" height="18" rx="2" fill="#0a0d1b"/>
      <text x="500" y="312" fill="#a2a9ce" font-size="10" font-weight="500" text-anchor="middle" font-family="'MiSans', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">是</text>

      <rect x="650" y="370" width="20" height="12" rx="2" fill="#0a0d1b"/>
      <text x="660" y="379" fill="#a2a9ce" font-size="10" font-weight="500" text-anchor="middle" font-family="'MiSans', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">否</text>

      <rect x="490" y="435" width="20" height="18" rx="2" fill="#0a0d1b"/>
      <text x="500" y="448" fill="#7d98ff" font-size="10" font-weight="500" text-anchor="middle" font-family="'MiSans', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">是</text>

      <!-- 起点：胶囊（淡染 + 轻描边） -->
      <rect x="420" y="40" width="160" height="48" rx="24" fill="rgba(224,228,255,0.03)" stroke="rgba(224,228,255,0.30)" stroke-width="1"/>
      <text x="500" y="68" fill="#e0e4ff" font-size="12" font-weight="600" text-anchor="middle" font-family="'MiSans', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">线上告警</text>

      <!-- 步骤：矩形 -->
      <rect x="420" y="120" width="160" height="48" rx="6" fill="#0a0d1b" stroke="rgba(224,228,255,0.40)" stroke-width="1"/>
      <text x="500" y="148" fill="#e0e4ff" font-size="12" font-weight="600" text-anchor="middle" font-family="'MiSans', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">值班确认影响面</text>

      <!-- 判断 1：菱形 200×96（宽高比 ≈ 2:1） -->
      <polygon points="500,192 600,240 500,288 400,240" fill="#0a0d1b" stroke="rgba(224,228,255,0.40)" stroke-width="1"/>
      <text x="500" y="236" fill="#e0e4ff" font-size="12" font-weight="600" text-anchor="middle" font-family="'MiSans', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">核心链路</text>
      <text x="500" y="252" fill="#e0e4ff" font-size="12" font-weight="600" text-anchor="middle" font-family="'MiSans', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">受损？</text>

      <!-- 终点：观察（胶囊） -->
      <rect x="720" y="216" width="160" height="48" rx="24" fill="rgba(224,228,255,0.03)" stroke="rgba(224,228,255,0.30)" stroke-width="1"/>
      <text x="800" y="240" fill="#e0e4ff" font-size="12" font-weight="600" text-anchor="middle" font-family="'MiSans', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">观察跟进</text>
      <text x="800" y="254" fill="#a2a9ce" font-size="10" text-anchor="middle" font-family="'Sarasa Mono SC', ui-monospace, monospace">值班记录 · 例会同步</text>

      <!-- 判断 2：菱形 200×96 -->
      <polygon points="500,328 600,376 500,424 400,376" fill="#0a0d1b" stroke="rgba(224,228,255,0.40)" stroke-width="1"/>
      <text x="500" y="372" fill="#e0e4ff" font-size="12" font-weight="600" text-anchor="middle" font-family="'MiSans', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">能在 30 分钟</text>
      <text x="500" y="388" fill="#e0e4ff" font-size="12" font-weight="600" text-anchor="middle" font-family="'MiSans', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">内修复？</text>

      <!-- 终点：立即回滚（胶囊） -->
      <rect x="720" y="352" width="160" height="48" rx="24" fill="rgba(224,228,255,0.03)" stroke="rgba(224,228,255,0.30)" stroke-width="1"/>
      <text x="800" y="376" fill="#e0e4ff" font-size="12" font-weight="600" text-anchor="middle" font-family="'MiSans', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">立即回滚</text>
      <text x="800" y="390" fill="#a2a9ce" font-size="10" text-anchor="middle" font-family="'Sarasa Mono SC', ui-monospace, monospace">先恢复 · 再排查</text>

      <!-- 终点：热修并验证（焦点胶囊，accent） -->
      <rect x="420" y="464" width="160" height="56" rx="28" fill="rgba(125,152,255,0.10)" stroke="#7d98ff" stroke-width="1.2"/>
      <text x="500" y="492" fill="#e0e4ff" font-size="12" font-weight="600" text-anchor="middle" font-family="'MiSans', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">热修并验证</text>
      <text x="500" y="508" fill="#a2a9ce" font-size="10" text-anchor="middle" font-family="'Sarasa Mono SC', ui-monospace, monospace">修复 · 复盘</text>
