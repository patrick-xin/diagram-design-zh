<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>存储方案选型评估 · 雷达图</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #0a0d1b;
      --color-ink:     #e0e4ff;
      --color-muted:   #a2a9ce;
      --color-accent:  #7d98ff;
      --font-sans:     'MiSans', 'Noto Sans SC', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif;
      --font-serif:    'Noto Serif SC', 'Songti SC', 'SimSun', serif;
      --font-mono:     'Sarasa Mono SC', 'Noto Sans SC', ui-monospace, 'SF Mono', Menlo, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; padding-left: 4%; }

    .eyebrow {
      font-family: var(--font-sans);
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.3em;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: 0;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 3rem;
    }

    svg { width: 100%; min-width: 900px; display: block; overflow: visible; }
  
.back-link{display:inline-block;font-family:var(--font-mono);font-size:10px;letter-spacing:0.1em;color:var(--color-muted);text-decoration:none;margin:0 0 1.25rem}
.back-link:hover{color:var(--color-accent)}

    <h1>存储方案选型评估</h1>

    <svg viewBox="0 0 1000 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="example-radar-dark-title example-radar-dark-desc">

      <desc id="example-radar-dark-desc">雷达图：四个存储方案在吞吐量、响应、生态、运维、成本五项维度上按十分制对比，OpenSearch 综合面最均衡（推荐焦点），ClickHouse 吞吐突出但运维与成本弱。</desc>
        <rect width="100%" height="100%" fill="#0a0d1b"/>

      <!-- 网格环（内四环淡、外环略重） -->
      <polygon points="500,144 530,166 519,202 481,202 470,166" fill="none" stroke="rgba(224,228,255,0.10)" stroke-width="0.8"/>
      <polygon points="500,112 561,156 538,228 462,228 439,156" fill="none" stroke="rgba(224,228,255,0.10)" stroke-width="0.8"/>

      <polygon points="500,16 652,127 594,305 406,305 348,127" fill="none" stroke="rgba(224,228,255,0.30)" stroke-width="1"/>

      <!-- 轴辐条（无箭头） -->
      <line x1="500" y1="176" x2="500" y2="16"  stroke="rgba(224,228,255,0.30)" stroke-width="1"/>
      <line x1="500" y1="176" x2="652" y2="127" stroke="rgba(224,228,255,0.30)" stroke-width="1"/>
      <line x1="500" y1="176" x2="594" y2="305" stroke="rgba(224,228,255,0.30)" stroke-width="1"/>
      <line x1="500" y1="176" x2="406" y2="305" stroke="rgba(224,228,255,0.30)" stroke-width="1"/>
      <line x1="500" y1="176" x2="348" y2="127" stroke="rgba(224,228,255,0.30)" stroke-width="1"/>

      <text x="500" y="0"  fill="#e0e4ff" font-size="12" font-weight="600" text-anchor="middle" font-family="'MiSans', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">吞吐量</text>
      <text x="668" y="123" fill="#e0e4ff" font-size="12" font-weight="600" text-anchor="start" dominant-baseline="middle" font-family="'MiSans', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">响应</text>
      <text x="606" y="328" fill="#e0e4ff" font-size="12" font-weight="600" text-anchor="middle" font-family="'MiSans', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">生态</text>

      <!-- 刻度只标顶部轴 -->
      <text x="492" y="148" fill="#a2a9ce" font-size="9" text-anchor="end" font-family="'Sarasa Mono SC', ui-monospace, monospace">2</text>
      <text x="492" y="116" fill="#a2a9ce" font-size="9" text-anchor="end" font-family="'Sarasa Mono SC', ui-monospace, monospace">4</text>

      <rect x="72" y="396" width="16" height="12" rx="2" fill="#7d98ff"/>

      <rect x="200" y="396" width="16" height="12" rx="2" fill="#5fbf93"/>

      <rect x="330" y="396" width="16" height="12" rx="2" fill="#f2a267"/>

      <rect x="444" y="396" width="16" height="12" rx="2" fill="#e78c88"/>
