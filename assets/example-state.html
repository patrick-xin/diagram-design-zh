<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文章生命周期 · 状态机</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #ffffff;
      --color-ink:     #29314f;
      --color-muted:   #565e7e;
      --color-accent:  #1a4dd9;
      --font-sans:     'MiSans', 'Noto Sans SC', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif;
      --font-serif:    'Noto Serif SC', 'Songti SC', 'SimSun', serif;
      --font-mono:     'Sarasa Mono SC', 'Noto Sans SC', ui-monospace, 'SF Mono', Menlo, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; padding-left: 4%; }

    .eyebrow {
      font-family: var(--font-sans);
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.3em;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: 0;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; overflow: visible; }

  <div class="frame">
    <p class="eyebrow">状态机 · 图表设计</p>
    <h1>文章生命周期 · 从草稿到归档</h1>

    <svg viewBox="0 0 1000 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="example-state-title example-state-desc">
      <title id="example-state-title">文章生命周期状态机</title>
      <desc id="example-state-desc">状态机：文章从草稿起步，提交后进入审核中，通过后发布上线（焦点强调），过期后归档并最终清理；驳回时带修改意见退回草稿。</desc>
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(41,49,79,0.10)"/>
          </pattern>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#565e7e"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1a4dd9"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#ffffff"/>
        <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

        <!-- 转移线（先画） -->
        <!-- 起点 → 草稿 -->
        <line x1="12" y1="112" x2="160" y2="112" stroke="#565e7e" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- 草稿 → 审核中 -->
        <line x1="320" y1="112" x2="480" y2="112" stroke="#565e7e" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- 审核中 → 已发布（焦瑚 · 正向主路径） -->
        <line x1="640" y1="112" x2="800" y2="112" stroke="#1a4dd9" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <!-- 已发布 → 已归档（向下） -->
        <line x1="880" y1="152" x2="880" y2="212" stroke="#565e7e" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- 已归档 → 终点（向下） -->
