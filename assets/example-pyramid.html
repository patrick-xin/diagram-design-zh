<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>用户参与金字塔 · 金字塔图</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #ffffff;
      --color-ink:     #29314f;
      --color-muted:   #565e7e;
      --color-soft:    #8f94ab;
      --color-accent:  #1a4dd9;
      --color-paper-2: #f3f2ff;
      --font-sans:     'MiSans', 'Noto Sans SC', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif;
      --font-serif:    'Noto Serif SC', 'Songti SC', 'SimSun', serif;
      --font-mono:     'Sarasa Mono SC', 'Noto Sans SC', ui-monospace, 'SF Mono', Menlo, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; padding-left: 4%; }

    .eyebrow {
      font-family: var(--font-sans);
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.3em;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: 0;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 3rem;
    }

    svg { width: 100%; min-width: 900px; display: block; overflow: visible; }
  
.page-nav{display:flex;justify-content:space-between;align-items:center;margin:0 0 1.25rem}
.back-link{font-family:var(--font-sans);font-size:12px;font-weight:500;letter-spacing:0.08em;color:var(--color-muted);text-decoration:none}
.back-link:hover{color:var(--color-accent)}

      <desc id="example-pyramid-desc">金字塔图：社区用户按参与深度分层——潜水用户约九成只浏览，互动用户点赞评论，贡献用户产出内容；塔尖的核心创作者（约千分之一）定义社区调性，是全图焦点；越往上越稀有、影响越大。</desc>

      <rect width="100%" height="100%" fill="#ffffff"/>

      <!-- 左缘轴：稀有度方向 -->
      <line x1="60" y1="16" x2="60" y2="296" stroke="rgba(41,49,79,0.30)" stroke-width="1"/>
      <polygon points="56,16 64,16 60,4" fill="rgba(41,49,79,0.40)"/>
      <text x="40" y="192" fill="#565e7e" font-size="10" font-weight="500" letter-spacing="0.2em" text-anchor="middle" transform="rotate(-90 40 192)" font-family="'MiSans', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">更稀有 · 更少数 · 影响更大</text>

      <!-- 基座层：潜水用户 -->
      <polygon points="244,256 756,256 820,320 180,320" fill="#f3f2ff" stroke="rgba(41,49,79,0.12)" stroke-width="1"/>
      <text x="500" y="284" fill="#29314f" font-size="12" font-weight="600" text-anchor="middle" font-family="'MiSans', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">潜水用户</text>
      <text x="500" y="300" fill="#565e7e" font-size="10" text-anchor="middle" font-family="'Sarasa Mono SC', ui-monospace, monospace">只浏览 · 不发声</text>
      <text x="836" y="292" fill="#8f94ab" font-size="9" letter-spacing="0.08em" font-family="'Sarasa Mono SC', ui-monospace, monospace">90%</text>

      <!-- 三层：互动用户 -->
      <polygon points="308,192 692,192 756,256 244,256" fill="#f3f2ff" stroke="rgba(41,49,79,0.12)" stroke-width="1"/>
      <text x="500" y="220" fill="#29314f" font-size="12" font-weight="600" text-anchor="middle" font-family="'MiSans', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">互动用户</text>
      <text x="500" y="236" fill="#565e7e" font-size="10" text-anchor="middle" font-family="'Sarasa Mono SC', ui-monospace, monospace">点赞 · 评论 · 收藏</text>
      <text x="776" y="228" fill="#8f94ab" font-size="9" letter-spacing="0.08em" font-family="'Sarasa Mono SC', ui-monospace, monospace">9%</text>

      <!-- 二层：贡献用户 -->
      <polygon points="372,128 628,128 692,192 308,192" fill="#f3f2ff" stroke="rgba(41,49,79,0.12)" stroke-width="1"/>
      <text x="500" y="156" fill="#29314f" font-size="12" font-weight="600" text-anchor="middle" font-family="'MiSans', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">贡献用户</text>
      <text x="500" y="172" fill="#565e7e" font-size="10" text-anchor="middle" font-family="'Sarasa Mono SC', ui-monospace, monospace">发帖 · 测评 · 攻略</text>
      <text x="716" y="164" fill="#8f94ab" font-size="9" letter-spacing="0.08em" font-family="'Sarasa Mono SC', ui-monospace, monospace">0.9%</text>

      <!-- 塔尖：核心创作者（焦点三角，与下层同坡） -->
      <polygon points="500,0 628,128 372,128" fill="rgba(26,77,217,0.08)" stroke="#1a4dd9" stroke-width="1.2"/>
      <text x="500" y="96" fill="#29314f" font-size="12" font-weight="600" text-anchor="middle" font-family="'MiSans', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">核心创作者</text>
      <text x="500" y="112" fill="#565e7e" font-size="10" text-anchor="middle" font-family="'Sarasa Mono SC', ui-monospace, monospace">定调性 · 立标杆</text>
      <text x="656" y="88" fill="#1a4dd9" font-size="9" letter-spacing="0.08em" font-family="'Sarasa Mono SC', ui-monospace, monospace">0.1%</text>

      <!-- 塔底脚注 -->
      <text x="500" y="360" fill="#565e7e" font-size="12" text-anchor="middle" font-family="'MiSans', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">基座撑起塔尖，塔尖定义基座。</text>

      <!-- 图例横条 -->
      <line x1="0" y1="420" x2="1000" y2="420" stroke="rgba(41,49,79,0.10)" stroke-width="0.8"/>
      <text x="0" y="438" fill="#565e7e" font-size="10" letter-spacing="0.1em" font-family="'Sarasa Mono SC', ui-monospace, monospace">图例</text>

      <rect x="72" y="428" width="16" height="12" rx="2" fill="rgba(26,77,217,0.08)" stroke="#1a4dd9" stroke-width="1.2"/>
      <text x="96" y="438" fill="#565e7e" font-size="10" font-family="'MiSans', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">塔尖——最稀有、杠杆最大</text>

      <rect x="264" y="428" width="16" height="12" rx="2" fill="#f3f2ff" stroke="rgba(41,49,79,0.30)" stroke-width="1"/>
      <text x="288" y="438" fill="#565e7e" font-size="10" font-family="'MiSans', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">支撑层——体量工作</text>

      <text x="1000" y="438" text-anchor="end" fill="#565e7e" font-size="10" font-family="'MiSans', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">层宽诚实：越窄 = 越稀有</text>
    </svg>
  </div>
</body>
</html>
