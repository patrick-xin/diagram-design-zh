<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>对象存储占用分布 · 矩形树图</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #0a0d1b;
      --color-ink:     #e0e4ff;
      --color-muted:   #a2a9ce;
      --color-accent:  #7d98ff;
      --font-sans:     'MiSans', 'Noto Sans SC', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif;
      --font-serif:    'Noto Serif SC', 'Songti SC', 'SimSun', serif;
      --font-mono:     'Sarasa Mono SC', 'Noto Sans SC', ui-monospace, 'SF Mono', Menlo, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; padding-left: 4%; }

    .eyebrow {
      font-family: var(--font-sans);
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.3em;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: 0;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 3rem;
    }

    svg { width: 100%; min-width: 900px; display: block; overflow: visible; }
  
.back-link{display:inline-block;font-family:var(--font-mono);font-size:10px;letter-spacing:0.1em;color:var(--color-muted);text-decoration:none;margin:0 0 1.25rem}
.back-link:hover{color:var(--color-accent)}
