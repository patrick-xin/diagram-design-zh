<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>支付网关块分解 · 语义模式</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #0a0d1b;
      --color-ink:     #e0e4ff;
      --color-muted:   #a2a9ce;
      --color-accent:  #7d98ff;
      --font-sans:     'MiSans', 'Noto Sans SC', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif;
      --font-serif:    'Noto Serif SC', 'Songti SC', 'SimSun', serif;
      --font-mono:     'Sarasa Mono SC', 'Noto Sans SC', ui-monospace, 'SF Mono', Menlo, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; padding-left: 4%; }
    .eyebrow {
      font-family: var(--font-sans);
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.3em;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: 0;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 3rem;
    }
    .diagram-container { width: 100%; overflow-x: auto; }
    svg { width: 100%; min-width: 900px; display: block; overflow: visible; }

    <h1>支付网关块分解</h1>

<svg viewBox="0 0 1000 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="example-tree-block-decomposition-dark-title example-tree-block-decomposition-dark-desc">
      <title id="example-tree-block-decomposition-dark-title">支付网关块分解</title>
      <desc id="example-tree-block-decomposition-dark-desc">支付网关分解为卡授权、风控筛查与结算台账三块；每块带稳定 ID、输入、输出、约束与实现路径，分解全程可追溯。</desc>
