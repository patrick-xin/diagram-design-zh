<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>成对策略评估：分歧出现在哪一步</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root {
      --paper: #ffffff;
      --paper-2: #f3f2ff;
      --ink: #29314f;
      --muted: #565e7e;
      --soft: #8f94ab;
      --rule: rgba(41,49,79,0.12);
      --rule-strong: rgba(41,49,79,0.30);
      --accent: #1a4dd9;
      --accent-tint: rgba(26,77,217,0.08);
      --font-sans: 'MiSans', 'Noto Sans SC', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif;
      --font-serif: 'Noto Serif SC', 'Songti SC', 'SimSun', serif;
      --font-mono: 'Sarasa Mono SC', 'Noto Sans SC', ui-monospace, 'SF Mono', Menlo, monospace;
      --motion-fast: 160ms;
      --motion-step: 480ms;
      --motion-hold: 720ms;
      --motion-total: 3600ms;
      --motion-ease: cubic-bezier(.2,.8,.2,1);
    }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 3rem 2rem;
      color: var(--ink);
      background: var(--paper);
      font-family: var(--font-sans);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    [data-motion-root] {
      max-width: 1200px;
      width: 100%;
      padding-left: 4%;
    }
    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 4rem;
      margin-bottom: 4rem;
    }
    .eyebrow {
      margin: 0 0 8px;
      color: var(--muted);
      font-family: var(--font-sans);
      font-size: 0.75rem;
      font-weight: 500;
      line-height: 1.4;
      letter-spacing: 0.3em;
    }
    h1 {
      margin: 0;
      font-family: var(--font-serif);
      font-size: 1.75rem;
      font-weight: 400;
      line-height: 1.15;
      letter-spacing: 0;
    }
    .lede {
      flex: 0 1 420px;
      max-width: 420px;
      margin: 0;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.55;
    }
    .diagram-wrap {
      overflow-x: auto;
      padding: 2px 0;
    }
    svg { display: block; width: 100%; min-width: 900px; overflow: visible; }

    [data-motion-controls] {
      display: none;
      align-items: center;
      gap: 8px;
      min-height: 44px;
      margin-top: 1rem;
      padding: 0;
    }
    .motion-ready [data-motion-controls] { display: flex; }
    [data-motion-controls][hidden] { display: none !important; }
    [data-motion-controls] button {
      min-width: 44px;
      min-height: 44px;
      padding: 8px 12px;
      border: 1px solid var(--muted);
      border-radius: 4px;
      color: var(--ink);
      background: var(--paper);
      font-family: var(--font-sans);
      font-size: 12px;
      font-weight: 600;
      line-height: 1;
      cursor: pointer;
    }
    [data-motion-controls] button:hover { border-color: var(--accent); }
    [data-motion-controls] button:focus-visible,
    [data-motion-root]:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 2px;
    }
    [data-motion-controls] button:disabled { cursor: not-allowed; opacity: .45; }
    .keyboard-help {
      margin-left: 8px;
      color: var(--soft);
      font-family: var(--font-sans);
      font-size: 10px;
      font-weight: 500;
      line-height: 1.4;
    }
    [data-motion-status-visible] {
      margin-left: auto;
      color: var(--muted);
      font-family: var(--font-sans);
      font-size: 10px;
      font-weight: 500;
      line-height: 1.4;
      white-space: nowrap;
    }
    [data-motion-status] {
      display: block;
      min-width: 272px;
      min-height: 16px;
      margin: 8px 0 0;
      color: var(--muted);
      font-family: var(--font-sans);
      font-size: 10px;
      font-weight: 500;
      line-height: 1.4;
      text-align: right;
    }
    noscript p {
      margin: 12px 0 0;
      color: var(--muted);
      font-family: var(--font-sans);
      font-size: 10px;
      font-weight: 500;
      line-height: 1.4;
    }

    /* 动效条目状态：幽灵预显（见 animation.md）——
       未揭示 = opacity .12 压暗预告；transition 挂基态，显隐双向平滑。 */
    .motion-ready [data-motion-item] {
      opacity: .12;
      transform: translateY(8px);
      transform-box: fill-box;
      transform-origin: center;
      transition: opacity var(--motion-step) var(--motion-ease),
                  transform var(--motion-step) var(--motion-ease);
    }
    .motion-ready [data-motion-item].is-visible,
    .motion-ready[data-frame="end"] [data-motion-item],
    .motion-ready[data-frame="static"] [data-motion-item] {
      opacity: 1;
      transform: none;
    }
    /* 当前步的行聚焦框：虚线勾边，颜色之外的第二通道 */
    .row-focus { fill: transparent; stroke: transparent; stroke-width: 1.2; }
    .motion-ready [data-motion-item].is-current .row-focus {
      stroke: var(--muted);
      stroke-dasharray: 4 4;
    }
    html[data-motion="static"] [data-motion-controls] { display: none !important; }
    html[data-motion="static"] [data-motion-item] {
      opacity: 1 !important;
      transform: none !important;
      transition: none !important;
    }
    html[data-motion="step"] [data-motion-controls],
    html[data-motion="step"] [data-motion-decorative] { display: none !important; }
    html[data-motion="step"] [data-motion-item] {
      animation: none !important;
      transition: none !important;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .001ms !important;
      }
      [data-motion-item] { opacity: 1 !important; transform: none !important; }
      [data-motion-decorative] { display: none !important; }
      [data-motion-controls] { display: none !important; }
    }
    @media print {
      body { padding: 0; }
      [data-motion-controls], [data-motion-decorative] { display: none !important; }
      [data-motion-item] { opacity: 1 !important; transform: none !important; }
    }
    @media (max-width: 800px) {
      body { padding: 20px; }
      .page-header { display: block; }
      .lede { margin-top: 12px; }
      [data-motion-status] { min-width: 200px; }
      .keyboard-help { display: none; }
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  
.page-nav{display:flex;justify-content:space-between;align-items:center;margin:0 0 1.25rem}
.back-link{font-family:var(--font-sans);font-size:12px;font-weight:500;letter-spacing:0.08em;color:var(--color-muted);text-decoration:none}
.back-link:hover{color:var(--color-accent)}

        <p class="eyebrow">语义模式 · 成对策略评估追踪</p>
        <h1>成对策略评估：分歧出现在哪一步</h1>
      </div>
      <p class="lede">两条请求走过同一套有序规则。显式状态区分「这条规则不适用」与「评估根本没走到那条规则」。</p>
    </header>

    <div class="diagram-wrap">
      <svg viewBox="0 0 1000 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="example-policy-trace-animated-title example-policy-trace-animated-desc" data-motion-primitive="policy-evaluation">
        <title id="example-policy-trace-animated-title">成对策略评估：首个分歧在数据分级规则</title>
        <desc id="example-policy-trace-animated-desc">两条请求先后通过身份绑定与内部受众检查；到数据分级规则处，只读请求通过而敏感写入请求失败；后续规则一条被跳过、一条未到达，最终分别得到允许与拒绝两种结果。</desc>
        <rect width="1000" height="640" fill="#ffffff"/>

        <g transform="translate(0 -44)">
        <!-- 贯穿线：追踪 B 在失败终态处截断（每帧都有意义） -->
        <line x1="512" y1="104" x2="512" y2="528" stroke="rgba(41,49,79,0.30)" stroke-width="1"/>
        <line data-trace-connector="trace-b" x1="840" y1="104" x2="840" y2="336" stroke="rgba(41,49,79,0.30)" stroke-width="1"/>

        <!-- 规则列与两条追踪的表头 -->
        <text x="40" y="76" fill="#565e7e" font-family="'MiSans', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="500" letter-spacing="0.3em">有序策略规则</text>
        <rect x="392" y="44" width="240" height="60" rx="6" fill="#ffffff" stroke="rgba(41,49,79,0.40)" stroke-width="1"/>
        <text x="512" y="72" text-anchor="middle" fill="#29314f" font-family="'MiSans', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="600">追踪 A · 只读</text>
        <text x="512" y="92" text-anchor="middle" fill="#565e7e" font-family="'MiSans', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12">内部指标请求</text>
        <rect x="720" y="44" width="240" height="60" rx="6" fill="#ffffff" stroke="rgba(41,49,79,0.40)" stroke-width="1"/>
        <text x="832" y="72" text-anchor="middle" fill="#29314f" font-family="'MiSans', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="600">追踪 B · 敏感写入</text>
        <text x="832" y="92" text-anchor="middle" fill="#565e7e" font-family="'MiSans', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12">受限记录请求</text>

        <g transform="translate(-48 0)">
        <g data-motion-item data-step="1" aria-label="规则 1 身份绑定：两条追踪都通过">
          <rect class="row-focus" x="48" y="124" width="952" height="68" rx="4"/>
          <text x="88" y="152" fill="#29314f" font-family="'MiSans', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="600">1 · 身份绑定</text>
          <text x="88" y="172" fill="#565e7e" font-family="'MiSans', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12">要求具名主体</text>
          <rect x="440" y="132" width="240" height="52" rx="4" fill="rgba(41,49,79,0.05)" stroke="rgba(41,49,79,0.40)" stroke-width="1"/>
          <text x="560" y="164" text-anchor="middle" fill="#29314f" font-family="'MiSans', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="600">✓ 通过</text>
          <rect x="760" y="132" width="240" height="52" rx="4" fill="rgba(41,49,79,0.05)" stroke="rgba(41,49,79,0.40)" stroke-width="1"/>
          <text x="880" y="164" text-anchor="middle" fill="#29314f" font-family="'MiSans', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="600">✓ 通过</text>
        </g>

        <g data-motion-item data-step="2" aria-label="规则 2 内部受众：两条追踪都通过">
          <rect class="row-focus" x="48" y="200" width="952" height="68" rx="4"/>

    <!-- 播放控件 -->
    <div data-motion-controls role="group" aria-label="策略追踪播放控件">
      <button type="button" data-motion-action="prev">上一步</button>
      <button type="button" data-motion-action="play" aria-pressed="false">播放</button>
      <button type="button" data-motion-action="pause" aria-pressed="true">暂停</button>
      <button type="button" data-motion-action="next">下一步</button>
      <button type="button" data-motion-action="replay">重放</button>
      <span class="keyboard-help">←/→ 单步 · 空格 播放/暂停 · R 重放 · Home/End 跳转</span>
      <span data-motion-status-visible aria-hidden="true">第 <span data-motion-step-label>5</span> 步 / 共 5 步</span>
    </div>
    <p class="sr-only" data-motion-status role="status" aria-live="polite" aria-atomic="true"></p>
    <noscript><p>动效播放控件需要 JavaScript。上方展示的已是完整成品图。</p></noscript>
  </main>

  <script data-diagram-controls>
    (() => {
      const params = new URLSearchParams(location.search);
      const staticOverride = params.get('motion') === 'static' || document.documentElement.dataset.motion === 'static';
      const requestedStep = params.get('step');
      const reduce = matchMedia('(prefers-reduced-motion: reduce)');
      document.fonts.ready.then(() => { document.documentElement.dataset.fontsReady = 'true'; });

      document.querySelectorAll('[data-motion-root]').forEach((root) => {
        const count = Number(root.dataset.stepCount);
        const hold = parseFloat(getComputedStyle(root).getPropertyValue('--motion-hold')) || 720;
        const parsedStep = requestedStep !== null && /^\d+$/.test(requestedStep) ? Number(requestedStep) : null;
        const exactStep = params.get('motion') === 'step' && Number.isSafeInteger(parsedStep) && parsedStep >= 0 && parsedStep <= count ? parsedStep : null;
        const items = [...root.querySelectorAll('[data-motion-item]')];
        const labels = Array.from({ length: count + 1 }, (_, index) => index === 0
          ? '就绪'
          : items.filter((item) => !item.hasAttribute('data-motion-decorative') && Number(item.dataset.step) === index)
              .map((item) => item.getAttribute('aria-label')).join('；'));
        const controls = root.querySelector('[data-motion-controls]');
        const status = root.querySelector('[data-motion-status]');
        const visibleStep = root.querySelector('[data-motion-step-label]');
        let step = count;
        let timer = 0;
        let playing = false;
        let stepBeforeReduce = 0;
        let resumeAfterReduce = root.dataset.motionMode === 'reveal';

        const buttons = (action) => controls.querySelector(`[data-motion-action="${action}"]`);
        const clearClock = () => { window.clearTimeout(timer); timer = 0; };
        const announce = () => { status.textContent = `第 ${step} 步 / 共 ${count} 步：${labels[step] || '已完成'}`; };
        const setControlsAvailable = (available) => {
          controls.hidden = !available;
          controls.setAttribute('aria-hidden', String(!available));
          controls.dataset.playbackDisabled = String(!available);
          controls.querySelectorAll('button').forEach((control) => { control.disabled = !available; });
        };

        function render(next, userInitiated = false) {
          step = Math.max(0, Math.min(count, next));
          root.dataset.stepCurrent = String(step);
          root.dataset.frame = step === count ? 'end' : step === 0 ? 'start' : 'step';
          items.forEach((item) => {
            const itemStep = Number(item.dataset.step);
            item.classList.toggle('is-visible', itemStep <= step);
            item.classList.toggle('is-current', itemStep === step);
          });
          if (visibleStep) visibleStep.textContent = String(step);
          const unavailable = controls.dataset.playbackDisabled === 'true';
          buttons('prev').disabled = unavailable || step === 0;
          buttons('next').disabled = unavailable || step === count;
          if (userInitiated) announce();
        }

        function pause(userInitiated = false) {
          clearClock();
          playing = false;
          root.classList.remove('is-playing');
          buttons('play').setAttribute('aria-pressed', 'false');
          buttons('pause').setAttribute('aria-pressed', 'true');
          if (userInitiated) status.textContent = `已暂停 · 第 ${step} 步 / 共 ${count} 步`;
        }

        function finish() {
          pause(false);
          root.dataset.frame = 'end';
          status.textContent = `播放完成 · 第 ${count} 步 / 共 ${count} 步`;
        }

        function tick() {
          if (!playing) return;
          if (step >= count) { finish(); return; }
          render(step + 1, false);
          if (step >= count) { finish(); return; }
          timer = window.setTimeout(tick, hold);
        }

        function play(fromStart = false, userInitiated = false) {
          clearClock();
          if (fromStart || step >= count) render(0, userInitiated);
          playing = true;
          root.classList.add('is-playing');
          buttons('play').setAttribute('aria-pressed', 'true');
          buttons('pause').setAttribute('aria-pressed', 'false');
          timer = window.setTimeout(tick, hold);
        }

        controls.addEventListener('click', (event) => {
          const button = event.target.closest('[data-motion-action]');
          if (!button) return;
          const action = button.dataset.motionAction;
          if (action === 'play') play(false, true);
          if (action === 'pause') pause(true);
          if (action === 'replay') play(true, true);
          if (action === 'prev') { pause(false); render(step - 1, true); }
          if (action === 'next') { pause(false); render(step + 1, true); }
        });

        root.addEventListener('keydown', (event) => {
          if (event.target.matches('input, textarea, select, a[href]')) return;
          const keys = { ArrowLeft: step - 1, ArrowRight: step + 1, Home: 0, End: count };
          if (event.code === 'Space' && !event.target.closest('button')) {
            event.preventDefault();
            playing ? pause(true) : play(false, true);
            return;
          }
          if (!event.ctrlKey && !event.metaKey && !event.altKey && event.key.toLowerCase() === 'r') {
            event.preventDefault();
            play(true, true);
            return;
          }
          if (!(event.key in keys)) return;
          event.preventDefault();
          pause(false);
          render(keys[event.key], true);
        });

        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState === 'hidden' && playing) pause(false);
        });
        reduce.addEventListener('change', (event) => {
          if (event.matches && root.dataset.motionState !== 'reduced') {
            stepBeforeReduce = step;
            resumeAfterReduce = playing;
          }
          pause(false);
          if (event.matches) {
            setControlsAvailable(false);
            render(count, false);
            root.dataset.frame = 'static';
            root.dataset.motionState = 'reduced';
            status.textContent = '已减弱动效 · 完整静态画面 · 播放控件不可用';
          } else if (staticOverride || root.dataset.motionMode === 'none') {
            setControlsAvailable(false);
            render(count, false);
            root.dataset.frame = 'static';
            root.dataset.motionState = 'static';
            status.textContent = '静态画面 · 完整图表 · 播放控件不可用';
          } else {
            delete root.dataset.motionState;
            if (exactStep !== null) {
              setControlsAvailable(false);
              render(exactStep, false);
              root.dataset.frame = 'step';
              root.dataset.motionState = 'test';
              status.textContent = `测试画面 · 第 ${step} 步 / 共 ${count} 步 · 播放控件不可用`;
            } else {
              setControlsAvailable(true);
              render(stepBeforeReduce, false);
              status.textContent = `就绪 · 第 ${step} 步 / 共 ${count} 步`;
              if (resumeAfterReduce && root.dataset.motionMode === 'reveal') {
                play(false, false);
              }
            }
            resumeAfterReduce = false;
          }
        });

        if (staticOverride) {
          document.documentElement.dataset.motion = 'static';
          pause(false);
          setControlsAvailable(false);
          render(count, false);
          root.dataset.frame = 'static';
          root.dataset.motionState = 'static';
          status.textContent = '静态画面 · 完整图表 · 播放控件不可用';
        } else if (reduce.matches || root.dataset.motionMode === 'none') {
          pause(false);
          setControlsAvailable(false);
          render(count, false);
          root.dataset.frame = 'static';
          root.dataset.motionState = reduce.matches ? 'reduced' : 'static';
          status.textContent = reduce.matches
            ? '已减弱动效 · 完整静态画面 · 播放控件不可用'
            : '静态画面 · 完整图表 · 播放控件不可用';
        } else if (exactStep !== null) {
          document.documentElement.dataset.motion = 'step';
          pause(false);
          setControlsAvailable(false);
          render(exactStep, false);
          root.dataset.frame = 'step';
          root.dataset.motionState = 'test';
          status.textContent = `测试画面 · 第 ${step} 步 / 共 ${count} 步 · 播放控件不可用`;
        } else if (root.dataset.motionMode === 'reveal') {
          setControlsAvailable(true);
          render(0, false);
          play(false, false);
        } else {
          pause(false);
          setControlsAvailable(true);
          render(0, false);
          status.textContent = `就绪 · 第 0 步 / 共 ${count} 步`;
        }
        root.classList.add('motion-ready');
      });
    })();
  </script>
