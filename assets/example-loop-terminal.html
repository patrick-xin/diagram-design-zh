<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>增长飞轮 · 开发者工具 · 飞轮（终端）</title>
  <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      /* 终端皮肤是固定九 token 皮肤（style-guide § 终端皮肤），不参与品牌化与浅/深反转。
         三栈仍需齐全（self_check 硬校验）；本模板只有 mono 出场。 */
      :root {
        --color-page: #0a0a0a;       /* terminal-page */
        --color-paper: #141414;      /* terminal-paper */
        --color-bar: #1b1b1b;        /* terminal-bar */
        --color-border: #2b2b2b;     /* terminal-border */
        --color-ink: #f5f5f5;        /* terminal-ink */
        --color-muted: #9a9a9a;      /* terminal-muted */
        --color-soft: #5c5c5c;       /* terminal-soft */
        --color-accent: #7d98ff;     /* terminal-accent——焦点蓝的深色档，黑底对比 6.8:1 */
        --color-accent-tint: rgba(125, 152, 255, 0.12);
        --font-sans:  'MiSans', 'Noto Sans SC', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif;
        --font-serif: 'Noto Serif SC', 'Songti SC', 'SimSun', serif;
        --font-mono:  'Sarasa Mono SC', 'Noto Sans SC', ui-monospace, 'SF Mono', Menlo, monospace;
      }

      body {
        font-family: var(--font-mono);
        background: var(--color-page);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 3rem 2rem;
      }

      .terminal {
        width: 100%;
        max-width: 1200px;
        background: var(--color-paper);
        border: 1px solid var(--color-border);
        border-radius: 12px;
        overflow: hidden;
      }

      .titlebar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 12px 16px;
        background: var(--color-bar);
        border-bottom: 1px solid var(--color-border);
      }

      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--color-soft);
      }
      .dot.accent {
        background: var(--color-accent);
      } /* 三个点里恰好一个用 accent——1-accent 规则在此同样生效 */

      .titlebar-name {
        flex: 1;
        text-align: center;
        color: var(--color-muted);
        font-size: 0.7rem;
        font-weight: 500;
        letter-spacing: 0.04em;
        margin-right: 46px; /* 抵消三个圆点的宽度，让名字视觉居中 */
      }

      .frame {
        padding: 2.25rem 2.5rem 2.5rem;
      }

      .prompt {
        display: flex;
        gap: 0.6em;
        margin-bottom: 0.5rem;
        color: var(--color-muted);
        font-size: 0.75rem;
        font-weight: 500;
      }
      .prompt .sign {
        color: var(--color-accent);
      }

      h1 {
        font-family: var(--font-mono);
        font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
        font-weight: 700;
        letter-spacing: 0;
        line-height: 1.2;
        color: var(--color-ink);
        margin-bottom: 3rem;
      }
      h1::before {
        content: "# ";
        color: var(--color-soft);
      }

      svg {
        width: 100%;
        min-width: 900px;
        display: block;
        overflow: visible;
      }
