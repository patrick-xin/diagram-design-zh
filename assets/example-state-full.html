<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文章生命周期 · 状态机</title>
<style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      /* full token set */
      --color-paper:      #ffffff;
      --color-paper-2:    #f3f2ff;
      --color-ink:        #29314f;
      --color-muted:      #565e7e;
      --color-soft:       #8f94ab;
      --color-rule:       rgba(41,49,79,0.10);
      --color-accent:     #1a4dd9;
      --color-accent-tint: rgba(26,77,217,0.08);
      --color-link:       #1a4dd9;
      --font-sans:     'MiSans', 'Noto Sans SC', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif;
      --font-serif:    'Noto Serif SC', 'Songti SC', 'SimSun', serif;
      --font-mono:     'Sarasa Mono SC', 'Noto Sans SC', ui-monospace, 'SF Mono', Menlo, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-sans);
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.3em;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: 0;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }


    .subtitle {
      font-family: var(--font-sans);
      font-size: 1rem;
      line-height: 1.55;
      color: var(--color-muted);
      max-width: 58ch;
      margin-bottom: 4rem;
    }

    .diagram-container { overflow-x: auto; padding: 2px 0; }

    .cards { display: grid; grid-template-columns: 1.1fr 1fr 0.9fr; gap: 1rem; margin-top: 2rem; }
    @media (max-width: 820px) { .cards { grid-template-columns: 1fr; } }
    .card { background: var(--color-paper); border-radius: 6px; border: 1px solid var(--color-rule); padding: 1.25rem; }
    .card .eyebrow { margin-bottom: 0.5rem; }
    .card-header { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 0.875rem; padding-bottom: 0.875rem; border-bottom: 1px solid rgba(41,49,79,0.10); }
    .card-dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
    .card-dot.accent { background: var(--color-accent); }
    .card-dot.ink { background: var(--color-ink); }
    .card-dot.muted { background: var(--color-muted); }
    .card h3 { font-size: 0.875rem; font-weight: 600; letter-spacing: 0; }
    .card p, .card ul { color: var(--color-muted); font-size: 0.8125rem; line-height: 1.55; }
    .card ul { list-style: none; margin: 0; padding: 0; }
    .card li { margin-bottom: 0.3rem; padding-left: 0.875rem; position: relative; }
    .card li::before { content: '—'; position: absolute; left: 0; color: rgba(41,49,79,0.20); }

    .footer {
      margin-top: 1rem; padding-top: 1.5rem;
      border-top: 1px solid rgba(41,49,79,0.10);
      font-family: var(--font-mono); font-size: 0.75rem; letter-spacing: 0.06em;
      color: var(--color-soft);
      display: flex; justify-content: space-between; flex-wrap: wrap; gap: 0.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; overflow: visible; }

  <div class="frame">
    <p class="eyebrow">内容生产 · 状态机</p>
    <h1>文章生命周期 · 从草稿到归档</h1>
    <p class="subtitle">文章从草稿起步，提交后进入审核中，通过后发布上线（焦点），过期后归档并最终清理；驳回时带修改意见退回草稿重新编辑。</p>
    <div class="diagram-container">
      <svg viewBox="0 0 1000 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="example-state-full-title example-state-full-desc">
            <title id="example-state-full-title">文章生命周期状态机</title>
            <desc id="example-state-full-desc">状态机：文章从草稿起步，提交后进入审核中，通过后发布上线（焦点强调），过期后归档并最终清理；驳回时带修改意见退回草稿。</desc>
              <defs>
                <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#565e7e"/></marker>
                <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1a4dd9"/></marker>
              </defs>

              <rect width="100%" height="100%" fill="#ffffff"/>

              <line x1="12" y1="112" x2="160" y2="112" stroke="#565e7e" stroke-width="1.2" marker-end="url(#arrow)"/>

              <line x1="320" y1="112" x2="480" y2="112" stroke="#565e7e" stroke-width="1.2" marker-end="url(#arrow)"/>

              <line x1="640" y1="112" x2="800" y2="112" stroke="#1a4dd9" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
              <!-- 已发布 → 已归档（向下） -->
              <line x1="880" y1="152" x2="880" y2="212" stroke="#565e7e" stroke-width="1.2" marker-end="url(#arrow)"/>
              <!-- 已归档 → 终点（向下） -->
              <line x1="880" y1="312" x2="880" y2="344" stroke="#565e7e" stroke-width="1.2" marker-end="url(#arrow)"/>
              <!-- 审核中 → 草稿（驳回回退，虚线弧） -->
              <path d="M 560 68 C 560 4, 240 4, 240 68" fill="none" stroke="#565e7e" stroke-width="1.2" stroke-dasharray="4,3" stroke-dashoffset="6.01" marker-end="url(#arrow)"/>

    <div class="cards">
      <div class="card">
        <p class="eyebrow">焦点状态</p>
        <div class="card-header"><span class="card-dot accent"></span><h3>已发布 · 对外可见</h3></div>
        <p>正向主路径的终点——提交、审核通过后进入；驳回弧（虚线）从审核中带修改意见退回草稿，形成闭环。</p>
      </div>
      <div class="card">
        <p class="eyebrow">读法</p>
        <div class="card-header"><span class="card-dot ink"></span><h3>实心圆起 · 双环圆终</h3></div>
        <ul>
          <li>实线 = 正向转移，虚线 = 回退转移</li>
          <li>转移标签为中文事件词，骑线白底遮罩</li>
        </ul>
      </div>
      <div class="card">
        <p class="eyebrow">终态</p>
        <div class="card-header"><span class="card-dot muted"></span><h3>归档 · 清理</h3></div>
        <p>过期后进入归档（noindex 隐藏、旧链接跳转保留），最终清理是不可逆终态——双环圆标记。</p>
      </div>
    </div>
    <footer class="footer">
      <span>文章生命周期 · 状态机</span>
    </footer>
  </div>
