  <title>改版后，哪些自助流程更容易一次完成？· 哑铃图</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #ffffff;
      --color-ink: #29314f;
      --color-muted: #565e7e;
      --color-soft: #8f94ab;
      --color-rule: rgba(41,49,79,0.10);
      --color-accent: #1a4dd9;
      --font-sans: 'MiSans', 'Noto Sans SC', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif;
      --font-serif: 'Noto Serif SC', 'Songti SC', 'SimSun', serif;
      --font-mono: 'Sarasa Mono SC', 'Noto Sans SC', ui-monospace, 'SF Mono', Menlo, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; padding-left: 4%; }
    .eyebrow {
      font-family: var(--font-sans);
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.3em;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: 0;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 3rem;
    }
    .diagram-container { width: 100%; overflow-x: auto; padding: 2px 0; }
    svg { width: 100%; min-width: 900px; display: block; overflow: visible; }
    svg .sans { font-family: var(--font-sans); }
    svg .mono { font-family: var(--font-mono); }

<body>
  <main class="frame">
    <p class="eyebrow">产品体验 · 哑铃图</p>
    <h1>改版后，哪些自助流程更容易一次完成？</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="example-dumbbell-title example-dumbbell-desc">
        <title id="example-dumbbell-title">改版后，哪些自助流程更容易一次完成？</title>
        <desc id="example-dumbbell-desc">哑铃图比较六类自助流程改版前后的首次完成率：权限调整 47% 到 82%、账号找回 42% 到 68%、退款申请 34% 到 57%、工单升级 55% 到 73%、新成员接入 31% 到 44%、账单查询 64% 到 61%。示意数据，按变化绝对值降序。</desc>

        <rect width="100%" height="100%" fill="#ffffff"/>

        <!-- 共用横轴刻度的竖向网格；0% 刻度由轴线承载。 -->
        <line x1="320" y1="56" x2="320" y2="408" stroke="rgba(41,49,79,0.08)" stroke-width="0.8"/>
        <line x1="480" y1="56" x2="480" y2="408" stroke="rgba(41,49,79,0.08)" stroke-width="0.8"/>
        <line x1="640" y1="56" x2="640" y2="408" stroke="rgba(41,49,79,0.08)" stroke-width="0.8"/>
        <line x1="800" y1="56" x2="800" y2="408" stroke="rgba(41,49,79,0.08)" stroke-width="0.8"/>
        <line x1="960" y1="56" x2="960" y2="408" stroke="rgba(41,49,79,0.08)" stroke-width="0.8"/>
        <line x1="160" y1="40" x2="160" y2="420" stroke="rgba(41,49,79,0.30)" stroke-width="1"/>

        <!-- 0–100% 共用尺度：每格 20 个百分点。 -->
        <text class="mono" x="160" y="440" fill="#565e7e" font-size="9" text-anchor="middle">0</text>
        <text class="mono" x="320" y="440" fill="#565e7e" font-size="9" text-anchor="middle">20</text>
        <text class="mono" x="480" y="440" fill="#565e7e" font-size="9" text-anchor="middle">40</text>
        <text class="mono" x="640" y="440" fill="#565e7e" font-size="9" text-anchor="middle">60</text>
        <text class="mono" x="800" y="440" fill="#565e7e" font-size="9" text-anchor="middle">80</text>
        <text class="mono" x="960" y="440" fill="#565e7e" font-size="9" text-anchor="middle">100</text>
        <text class="sans" x="560" y="460" fill="#565e7e" font-size="10" text-anchor="middle">首次完成率（%）</text>

        <!-- 权限调整：47% → 82%，变化绝对值 35 个百分点。 -->
        <text class="sans" x="0" y="80" fill="#29314f" font-size="12" font-weight="600">权限调整</text>
        <line x1="542" y1="76" x2="810" y2="76" stroke="rgba(41,49,79,0.60)" stroke-width="1.2"/>
        <circle cx="536" cy="76" r="6" fill="#ffffff" stroke="rgba(41,49,79,0.60)" stroke-width="1.5"/>
        <circle cx="816" cy="76" r="6" fill="rgba(41,49,79,0.60)" stroke="rgba(41,49,79,0.60)" stroke-width="1"/>
        <text class="mono" x="524" y="80" fill="#565e7e" font-size="9" text-anchor="end">47</text>
        <text class="mono" x="828" y="80" fill="#565e7e" font-size="9">82</text>

        <!-- 账号找回：42% → 68%，变化绝对值 26 个百分点。 -->
        <text class="sans" x="0" y="144" fill="#29314f" font-size="12" font-weight="600">账号找回</text>
        <line x1="502" y1="140" x2="698" y2="140" stroke="rgba(41,49,79,0.50)" stroke-width="1.2"/>
        <circle cx="496" cy="140" r="6" fill="#ffffff" stroke="rgba(41,49,79,0.50)" stroke-width="1.5"/>
        <circle cx="704" cy="140" r="6" fill="rgba(41,49,79,0.50)" stroke="rgba(41,49,79,0.50)" stroke-width="1"/>
        <text class="mono" x="484" y="144" fill="#565e7e" font-size="9" text-anchor="end">42</text>
        <text class="mono" x="716" y="144" fill="#565e7e" font-size="9">68</text>

        <!-- 退款申请：34% → 57%，变化绝对值 23 个百分点。 -->
        <text class="sans" x="0" y="208" fill="#29314f" font-size="12" font-weight="600">退款申请</text>
        <line x1="438" y1="204" x2="610" y2="204" stroke="rgba(41,49,79,0.40)" stroke-width="1.2"/>
        <circle cx="432" cy="204" r="6" fill="#ffffff" stroke="rgba(41,49,79,0.40)" stroke-width="1.5"/>
        <circle cx="616" cy="204" r="6" fill="rgba(41,49,79,0.40)" stroke="rgba(41,49,79,0.40)" stroke-width="1"/>
        <text class="mono" x="420" y="208" fill="#565e7e" font-size="9" text-anchor="end">34</text>
        <text class="mono" x="628" y="208" fill="#565e7e" font-size="9">57</text>

        <!-- 工单升级：55% → 73%，变化绝对值 18 个百分点。 -->
        <text class="sans" x="0" y="272" fill="#29314f" font-size="12" font-weight="600">工单升级</text>
        <line x1="606" y1="268" x2="738" y2="268" stroke="rgba(41,49,79,0.30)" stroke-width="1.2"/>
        <circle cx="600" cy="268" r="6" fill="#ffffff" stroke="rgba(41,49,79,0.30)" stroke-width="1.5"/>
        <circle cx="744" cy="268" r="6" fill="rgba(41,49,79,0.30)" stroke="rgba(41,49,79,0.30)" stroke-width="1"/>
        <text class="mono" x="588" y="272" fill="#565e7e" font-size="9" text-anchor="end">55</text>
        <text class="mono" x="756" y="272" fill="#565e7e" font-size="9">73</text>

        <!-- 新成员接入：31% → 44%，变化绝对值 13 个百分点。 -->
        <text class="sans" x="0" y="336" fill="#29314f" font-size="12" font-weight="600">新成员接入</text>
        <line x1="414" y1="332" x2="506" y2="332" stroke="rgba(41,49,79,0.30)" stroke-width="1.2"/>
        <circle cx="408" cy="332" r="6" fill="#ffffff" stroke="rgba(41,49,79,0.30)" stroke-width="1.5"/>
        <circle cx="512" cy="332" r="6" fill="rgba(41,49,79,0.30)" stroke="rgba(41,49,79,0.30)" stroke-width="1"/>
        <text class="mono" x="396" y="336" fill="#565e7e" font-size="9" text-anchor="end">31</text>
        <text class="mono" x="524" y="336" fill="#565e7e" font-size="9">44</text>

        <!-- 账单查询：改版后 61% 低于改版前 64%，不得按系列顺序摆标签。 -->
        <text class="sans" x="0" y="400" fill="#29314f" font-size="12" font-weight="600">账单查询</text>
        <line x1="654" y1="396" x2="666" y2="396" stroke="#1a4dd9" stroke-width="1.8"/>
        <circle cx="672" cy="396" r="6" fill="#ffffff" stroke="#1a4dd9" stroke-width="1.5"/>
        <circle cx="648" cy="396" r="6" fill="#1a4dd9" stroke="#1a4dd9" stroke-width="1"/>
        <text class="mono" x="636" y="400" fill="#565e7e" font-size="9" text-anchor="end">61</text>
        <text class="mono" x="684" y="400" fill="#565e7e" font-size="9">64</text>

        <!-- 图例：颜色与轮廓都标明两个时点，顺序按图中端点定义。 -->
        <line x1="0" y1="520" x2="1000" y2="520" stroke="rgba(41,49,79,0.10)" stroke-width="0.8"/>
        <text class="mono" x="0" y="538" fill="#565e7e" font-size="10" letter-spacing="0.1em">图例</text>
        <circle cx="78" cy="534" r="6" fill="#ffffff" stroke="rgba(41,49,79,0.60)" stroke-width="1.5"/>
        <text class="sans" x="96" y="538" fill="#565e7e" font-size="10">改版前</text>
        <circle cx="174" cy="534" r="6" fill="rgba(41,49,79,0.60)" stroke="rgba(41,49,79,0.60)" stroke-width="1"/>
        <text class="sans" x="192" y="538" fill="#565e7e" font-size="10">改版后</text>
        <line x1="280" y1="534" x2="308" y2="534" stroke="rgba(41,49,79,0.40)" stroke-width="1.2"/>
        <text class="sans" x="318" y="538" fill="#565e7e" font-size="10">墨色深浅表示变化幅度</text>
        <line x1="530" y1="534" x2="558" y2="534" stroke="#1a4dd9" stroke-width="1.8"/>
        <text class="sans" x="568" y="538" fill="#565e7e" font-size="10">唯一回落</text>
        <text class="sans" x="1000" y="538" fill="#8f94ab" font-size="10" text-anchor="end">示意数据 · 按变化绝对值降序</text>
      </svg>
    </div>
  </main>
