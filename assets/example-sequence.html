<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>扫码点单链路 · 时序</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #ffffff;
      --color-ink:     #29314f;
      --color-muted:   #565e7e;
      --color-accent:  #1a4dd9;
      --font-sans:     'MiSans', 'Noto Sans SC', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif;
      --font-serif:    'Noto Serif SC', 'Songti SC', 'SimSun', serif;
      --font-mono:     'Sarasa Mono SC', 'Noto Sans SC', ui-monospace, 'SF Mono', Menlo, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; padding-left: 4%; }

    .eyebrow {
      font-family: var(--font-sans);
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.3em;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: 0;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; overflow: visible; }

<body>
  <div class="frame">
    <p class="eyebrow">时序图 · 图表设计</p>
    <h1>扫码点单链路 · 从提单到取餐码</h1>

    <svg viewBox="0 0 1000 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="example-sequence-title example-sequence-desc">
      <title id="example-sequence-title">扫码点单链路时序图</title>
      <desc id="example-sequence-desc">时序图：用户、小程序、订单服务、支付服务四个参与者，时间自上而下。用户提起点单，小程序创建订单并发起支付，支付服务先做风控校验再异步回调订单服务，订单服务返回确认，最后小程序向用户展示取餐码（主线成功）。</desc>
        <defs>
          <marker id="arrow-filled" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#565e7e"/></marker>
          <marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#565e7e" stroke-width="1.2"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1a4dd9"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#ffffff"/>

        <!-- 参与者：顶部一排盒子 -->
        <rect x="40" y="0" width="120" height="40" rx="6" fill="#ffffff" stroke="rgba(41,49,79,0.40)" stroke-width="1"/>
        <text x="100" y="25" fill="#29314f" font-size="12" font-weight="600" text-anchor="middle" font-family="'MiSans', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">用户</text>
        <rect x="304" y="0" width="120" height="40" rx="6" fill="#ffffff" stroke="rgba(41,49,79,0.40)" stroke-width="1"/>
        <text x="364" y="25" fill="#29314f" font-size="12" font-weight="600" text-anchor="middle" font-family="'MiSans', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">小程序</text>
        <rect x="568" y="0" width="120" height="40" rx="6" fill="#ffffff" stroke="rgba(41,49,79,0.40)" stroke-width="1"/>
        <text x="628" y="25" fill="#29314f" font-size="12" font-weight="600" text-anchor="middle" font-family="'MiSans', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">订单服务</text>
        <rect x="832" y="0" width="120" height="40" rx="6" fill="#ffffff" stroke="rgba(41,49,79,0.40)" stroke-width="1"/>
        <text x="892" y="25" fill="#29314f" font-size="12" font-weight="600" text-anchor="middle" font-family="'MiSans', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">支付服务</text>

        <!-- 生命线 -->
        <line x1="100" y1="40" x2="100" y2="440" stroke="rgba(41,49,79,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="364" y1="40" x2="364" y2="440" stroke="rgba(41,49,79,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="628" y1="40" x2="628" y2="440" stroke="rgba(41,49,79,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="892" y1="40" x2="892" y2="440" stroke="rgba(41,49,79,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

        <!-- 激活条：该参与者持有控制的区间 -->
        <rect x="360" y="88" width="8" height="264" fill="rgba(41,49,79,0.05)" stroke="#565e7e" stroke-width="0.8"/>
        <rect x="624" y="132" width="8" height="176" fill="rgba(41,49,79,0.05)" stroke="#565e7e" stroke-width="0.8"/>
        <rect x="888" y="176" width="8" height="88" fill="rgba(41,49,79,0.05)" stroke="#565e7e" stroke-width="0.8"/>

        <!-- 1 同步调用：用户 → 小程序 -->
        <rect x="200" y="70" width="64" height="12" fill="#ffffff"/>
        <text x="232" y="82" fill="#565e7e" font-size="10" font-weight="500" text-anchor="middle" letter-spacing="0.12em" font-family="'MiSans', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">提起点单</text>
        <line x1="100" y1="88" x2="360" y2="88" stroke="#565e7e" stroke-width="1.2" marker-end="url(#arrow-filled)"/>

        <!-- 2 同步调用：小程序 → 订单服务 -->
        <rect x="464" y="114" width="64" height="12" fill="#ffffff"/>
        <text x="496" y="126" fill="#565e7e" font-size="10" font-weight="500" text-anchor="middle" letter-spacing="0.12em" font-family="'MiSans', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">创建订单</text>
        <line x1="368" y1="132" x2="624" y2="132" stroke="#565e7e" stroke-width="1.2" marker-end="url(#arrow-filled)"/>

        <!-- 3 同步调用：订单服务 → 支付服务 -->
        <rect x="728" y="158" width="64" height="12" fill="#ffffff"/>
