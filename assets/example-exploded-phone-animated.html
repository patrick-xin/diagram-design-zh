<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>手机拆解 · 爆炸轴测图 · 可选动效</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root {
      --color-paper: #ffffff;
      --color-ink: #29314f;
      --color-muted: #565e7e;
      --color-soft: #8f94ab;
      --color-accent: #1a4dd9;
      --color-rule: rgba(41,49,79,0.12);
      --font-sans: 'MiSans', 'Noto Sans SC', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif;
      --font-serif: 'Noto Serif SC', 'Songti SC', 'SimSun', serif;
      --font-mono: 'Sarasa Mono SC', 'Noto Sans SC', ui-monospace, 'SF Mono', Menlo, monospace;
      --motion-fast: 160ms;
      --motion-step: 480ms;
      --motion-hold: 720ms;
      --motion-total: 3600ms;
      --motion-ease: cubic-bezier(.2,.8,.2,1);
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 48px 32px;
      color: var(--color-ink);
      background: var(--color-paper);
      font-family: var(--font-sans);
    }
    [data-motion-root] { width: min(100%, 1000px); }
    .eyebrow {
      margin: 0 0 8px;
      color: var(--color-muted);
      font-family: var(--font-sans);
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.3em;
    }
    h1 { margin: 0 0 24px; font: 400 32px/1.15 var(--font-serif); }
    svg { display: block; width: 100%; min-width: 900px; overflow: visible; }
    .diagram-container { width: 100%; overflow-x: auto; }

    /* 静态源是完整的：只有初始化成功的增强才接管条目透明度。
       幽灵预显（2026-08-18 真机定案）：未揭示 = opacity .12 压暗预告，
       首屏能看到哪些元素即将动画；transition 挂基态，显隐双向平滑过渡。 */
    .motion-ready [data-motion-item] {
      opacity: .12;
      transform: translateY(8px);
      transform-box: fill-box;
      transform-origin: center;
      transition: opacity var(--motion-step) var(--motion-ease),
                  transform var(--motion-step) var(--motion-ease);
    }
    .motion-ready [data-motion-item].is-visible,
    .motion-ready[data-frame="end"] [data-motion-item],
    .motion-ready[data-frame="static"] [data-motion-item] {
      opacity: 1;
      transform: none;
    }
    .draw-path {
      fill: none;
      stroke: var(--color-accent);
      stroke-width: 3;
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      pointer-events: none;
    }
    .motion-ready .draw-path.is-visible {
      animation: draw-path var(--motion-step) linear forwards;
    }
    .flow-token { opacity: 0; pointer-events: none; }
    .motion-ready.is-playing .flow-token.is-visible {
      opacity: 1;
      animation: token-flow 3.2s linear 1 forwards;
    }
    .motion-ready[data-motion-mode="loop"].is-playing .flow-token.is-visible {
      animation-iteration-count: infinite;
    }
    @keyframes draw-path { to { stroke-dashoffset: 0; } }
    @keyframes token-flow {
      0% { transform: translateX(0); }
      100% { transform: translateX(240px); }
    }

    [data-motion-controls] {
      display: none;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--color-rule);
    }
    .motion-ready [data-motion-controls] { display: flex; }
    [data-motion-controls][hidden] { display: none !important; }
    [data-motion-controls] button {
      min-width: 44px;
      min-height: 44px;
      padding: 8px 12px;
      border: 1px solid var(--color-muted);
      border-radius: 4px;
      color: var(--color-ink);
      background: var(--color-paper);
      font-family: var(--font-sans);
      font-size: 12px;
      font-weight: 600;
      line-height: 1;
      cursor: pointer;
    }
    [data-motion-controls] button:hover { border-color: var(--color-accent); }
    [data-motion-controls] button:focus-visible {
      outline: 3px solid var(--color-accent);
      outline-offset: 2px;
    }
    [data-motion-controls] button:disabled { cursor: not-allowed; opacity: .45; }
    [data-motion-status-visible] {
      margin-left: auto;
      color: var(--color-muted);
      font-family: var(--font-sans);
      font-size: 12px;
      font-weight: 500;
      line-height: 1.4;
    }
    .keyboard-help {
      color: var(--color-soft);
      font-family: var(--font-sans);
      font-size: 12px;
      line-height: 1.4;
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
      border: 0;
    }
    noscript p {
      margin: 12px 0 0;
      color: var(--color-muted);
      font-family: var(--font-sans);
      font-size: 12px;
      font-weight: 500;
      line-height: 1.4;
    }

    html[data-motion="static"] [data-motion-controls],
    html[data-motion="static"] [data-motion-decorative] { display: none !important; }
    html[data-motion="static"] [data-motion-item] {
      opacity: 1 !important;
      transform: none !important;
      animation: none !important;
      transition: none !important;
    }
    html[data-motion="step"] [data-motion-controls],
    html[data-motion="step"] [data-motion-decorative] { display: none !important; }
    html[data-motion="step"] [data-motion-item] {
      animation: none !important;
      transition: none !important;
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .001ms !important;
      }
      [data-motion-item] { opacity: 1 !important; transform: none !important; }
      [data-motion-decorative] { display: none !important; }
      [data-motion-controls] { display: none !important; }
    }
    @media print {
      /* 纸面没有滚动条，局部滚动器会裁切而不是滚动；让图缩到整页。 */
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
      [data-motion-controls], [data-motion-decorative] { display: none !important; }
      [data-motion-item] {
        opacity: 1 !important;
        transform: none !important;
        animation: none !important;
        transition: none !important;
      }
    }

    /* 静态源即爆炸帧，初始化成功的增强才把它装回去。部件直上直下，
       一次竖直位移就是整个爆炸过程（type-exploded.md 记录的唯一位移例外）。 */
    .motion-ready [data-motion-item][data-part] { opacity: 1; transform: translateY(var(--lift)); }
    .motion-ready:not([data-frame="start"]) [data-motion-item][data-part] { transition: transform var(--motion-step) var(--motion-ease); }
    .motion-ready [data-motion-item][data-part].is-visible,
    .motion-ready[data-frame="end"] [data-motion-item][data-part],
    .motion-ready[data-frame="static"] [data-motion-item][data-part] { transform: none; }
    /* 部件标签组装态隐藏、落定后淡入（type-exploded.md：否则标签堆在闭合体上）。 */
    .motion-ready [data-part] .part-label { opacity: 0; transition: none; }
    .motion-ready [data-part].is-visible .part-label { opacity: 1; transition: opacity var(--motion-fast) linear var(--motion-step); }
    .motion-ready[data-frame="end"] .part-label,
    .motion-ready[data-frame="static"] .part-label { opacity: 1; }
    .motion-ready [data-motion-item][data-reveal] { opacity: .12; transform: none; transition: none; }
    .motion-ready [data-motion-item][data-reveal].is-visible { opacity: 1; transition: opacity var(--motion-step) var(--motion-ease); }
    .motion-ready[data-frame="end"] [data-motion-item][data-reveal],
    .motion-ready[data-frame="static"] [data-motion-item][data-reveal] { opacity: 1; }
    .motion-ready [data-motion-item][data-reveal] .part-label { opacity: 0; transition: none; }
    .motion-ready [data-motion-item][data-reveal].is-visible .part-label { opacity: 1; transition: opacity var(--motion-fast) linear var(--motion-step); }
    .motion-ready[data-frame="end"] [data-motion-item][data-reveal] .part-label,
    .motion-ready[data-frame="static"] [data-motion-item][data-reveal] .part-label { opacity: 1; }
    html[data-motion="static"] .part-label { opacity: 1 !important; }
    html[data-motion="step"] .part-label { transition: none !important; }
    @media (prefers-reduced-motion: reduce) { .part-label { opacity: 1 !important; } }
    @media print { .part-label { opacity: 1 !important; } }

  <script data-diagram-controls>
    (() => {
      const params = new URLSearchParams(location.search);
      const staticOverride = params.get('motion') === 'static' || document.documentElement.dataset.motion === 'static';
      const requestedStep = params.get('step');
      const reduce = matchMedia('(prefers-reduced-motion: reduce)');

        const count = Number(root.dataset.stepCount);

        const items = [...root.querySelectorAll('[data-motion-item]')];

          ? '就绪'
          : items.filter((item) => !item.hasAttribute('data-motion-decorative') && Number(item.dataset.step) === index)

        const visibleStep = root.querySelector('[data-motion-step-label]');

        let timer = 0;
        let playing = false;
        let stepBeforeReduce = 0;

          controls.setAttribute('aria-hidden', String(!available));

          root.dataset.frame = 'end';
          status.textContent = `播放完成 · 第 ${count} 步 / 共 ${count} 步`;

          if (step >= count) { finish(); return; }

            return;

          pause(false);
          setControlsAvailable(false);
          render(count, false);
          root.dataset.frame = 'static';
          root.dataset.motionState = 'static';
          status.textContent = '静态画面 · 完整图表 · 播放控件不可用';
        } else if (reduce.matches || root.dataset.motionMode === 'none') {
          pause(false);
          setControlsAvailable(false);
          render(count, false);
          root.dataset.frame = 'static';
          root.dataset.motionState = reduce.matches ? 'reduced' : 'static';
          status.textContent = reduce.matches
            ? '已减弱动效 · 完整静态画面 · 播放控件不可用'
            : '静态画面 · 完整图表 · 播放控件不可用';
        } else if (exactStep !== null) {
          document.documentElement.dataset.motion = 'step';
          pause(false);
          setControlsAvailable(false);
          render(exactStep, false);
          root.dataset.frame = 'step';
          root.dataset.motionState = 'test';
          status.textContent = `测试画面 · 第 ${step} 步 / 共 ${count} 步 · 播放控件不可用`;
        } else if (root.dataset.motionMode === 'reveal') {
          setControlsAvailable(true);
          render(0, false);
          play(false, false);
        } else {
          pause(false);
          setControlsAvailable(true);
          render(0, false);
          status.textContent = `就绪 · 第 0 步 / 共 ${count} 步`;
        }
        root.classList.add('motion-ready');
      });
    })();
  </script>
</body>
</html>
