<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 应用技术栈 · 分层</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #ffffff;
      --color-ink:     #29314f;
      --color-muted:   #565e7e;
      --color-accent:  #1a4dd9;
      --font-sans:     'MiSans', 'Noto Sans SC', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif;
      --font-serif:    'Noto Serif SC', 'Songti SC', 'SimSun', serif;
      --font-mono:     'Sarasa Mono SC', 'Noto Sans SC', ui-monospace, 'SF Mono', Menlo, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; padding-left: 4%; }

    .eyebrow {
      font-family: var(--font-sans);
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.3em;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: 0;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; overflow: visible; }

  <div class="frame">
    <p class="eyebrow">层级堆叠 · 图表设计</p>
    <h1>AI 应用技术栈 · 差异化到底发生在哪一层</h1>

    <svg viewBox="0 0 1000 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="example-layers-title example-layers-desc">
      <title id="example-layers-title">AI 应用技术栈分层图</title>
      <desc id="example-layers-desc">层级堆叠：从上到下依次是界面层、智能体框架（焦点强调层）、提示词层、SDK 客户端、模型权重层；左侧竖向标尺指示越往上越抽象。</desc>
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(41,49,79,0.10)"/>
          </pattern>
        </defs>

        <rect width="100%" height="100%" fill="#ffffff"/>
        <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

        <!-- 方向标尺（左侧留白） -->
        <text x="0" y="0" fill="#565e7e" font-size="10" font-weight="500" letter-spacing="0.3em" font-family="'MiSans', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">抽象</text>
        <line x1="28" y1="16" x2="28" y2="336" stroke="rgba(41,49,79,0.30)" stroke-width="1"/>
        <polygon points="24,16 32,16 28,8" fill="#565e7e"/>
        <text x="0" y="356" fill="#565e7e" font-size="10" font-weight="500" letter-spacing="0.3em" font-family="'MiSans', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">硬件</text>

        <!-- 堆叠外轮廓（上下边） -->
        <line x1="92" y1="16" x2="932" y2="16" stroke="rgba(41,49,79,0.10)" stroke-width="1"/>
        <line x1="92" y1="336" x2="932" y2="336" stroke="rgba(41,49,79,0.10)" stroke-width="1"/>

        <!-- L5 — 界面层 -->
        <rect x="92" y="16" width="840" height="64" fill="#ffffff"/>
        <line x1="92" y1="80" x2="932" y2="80" stroke="rgba(41,49,79,0.10)" stroke-width="1"/>
        <text x="112" y="52" fill="#565e7e" font-size="8" font-family="'Sarasa Mono SC', 'Noto Sans SC', ui-monospace, monospace" letter-spacing="0.14em">L5</text>
        <text x="232" y="55" fill="#29314f" font-size="14" font-weight="600" font-family="'MiSans', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">界面层</text>
        <text x="912" y="55" fill="#565e7e" font-size="10" font-family="'MiSans', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="end">对话 · 编辑器 · 画布</text>

        <!-- L4 — 智能体框架（焦点层） -->
        <rect x="92" y="80" width="840" height="64" fill="rgba(26,77,217,0.08)"/>
        <rect x="92" y="80" width="840" height="64" fill="none" stroke="#1a4dd9" stroke-width="1"/>
        <text x="112" y="116" fill="#1a4dd9" font-size="8" font-family="'Sarasa Mono SC', 'Noto Sans SC', ui-monospace, monospace" letter-spacing="0.14em" font-weight="600">L4</text>
        <text x="232" y="119" fill="#29314f" font-size="14" font-weight="600" font-family="'MiSans', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">智能体框架</text>
        <text x="912" y="119" fill="#1a4dd9" font-size="10" font-family="'MiSans', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="end">工具 · 记忆 · 循环</text>

        <!-- L3 — 提示词层 -->
        <rect x="92" y="144" width="840" height="64" fill="#ffffff"/>
        <line x1="92" y1="208" x2="932" y2="208" stroke="rgba(41,49,79,0.10)" stroke-width="1"/>
        <text x="112" y="180" fill="#565e7e" font-size="8" font-family="'Sarasa Mono SC', 'Noto Sans SC', ui-monospace, monospace" letter-spacing="0.14em">L3</text>
        <text x="232" y="183" fill="#29314f" font-size="14" font-weight="600" font-family="'MiSans', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">提示词层</text>
        <text x="912" y="183" fill="#565e7e" font-size="10" font-family="'MiSans', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="end">system · few-shot · 缓存</text>

        <!-- L2 — SDK 客户端 -->
        <rect x="92" y="208" width="840" height="64" fill="#f3f2ff"/>
        <line x1="92" y1="272" x2="932" y2="272" stroke="rgba(41,49,79,0.10)" stroke-width="1"/>
        <text x="112" y="244" fill="#565e7e" font-size="8" font-family="'Sarasa Mono SC', 'Noto Sans SC', ui-monospace, monospace" letter-spacing="0.14em">L2</text>
        <text x="232" y="247" fill="#29314f" font-size="14" font-weight="600" font-family="'MiSans', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">SDK 客户端</text>
        <text x="912" y="247" fill="#565e7e" font-size="10" font-family="'MiSans', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="end">鉴权 · 重试 · 流式</text>

        <!-- L1 — 模型权重层 -->
        <rect x="92" y="272" width="840" height="64" fill="#f3f2ff"/>
        <text x="112" y="308" fill="#565e7e" font-size="8" font-family="'Sarasa Mono SC', 'Noto Sans SC', ui-monospace, monospace" letter-spacing="0.14em">L1</text>
        <text x="232" y="311" fill="#29314f" font-size="14" font-weight="600" font-family="'MiSans', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">模型权重层</text>
        <text x="912" y="311" fill="#565e7e" font-size="9" font-family="'Sarasa Mono SC', 'Noto Sans SC', ui-monospace, monospace" text-anchor="end" letter-spacing="0.08em">opus · sonnet · haiku</text>

        <!-- 焦点层旁注（callout：serif italic，全图至多一条） -->
        <text x="92" y="392" fill="#565e7e" font-size="10" font-weight="500" letter-spacing="0.3em" font-family="'MiSans', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">焦点层</text>
        <text x="180" y="393" fill="#565e7e" font-size="14" font-style="italic" font-family="'Noto Serif SC', 'Songti SC', 'SimSun', serif">产品的差异化大多落在框架层——工具、记忆，以及把模型调用缝合成实际工作的那个循环。</text>
