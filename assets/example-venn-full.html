<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>数据团队成员画像 · 维恩图</title>
<style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      /* full token set */
      --color-paper:      #ffffff;
      --color-paper-2:    #f3f2ff;
      --color-ink:        #29314f;
      --color-muted:      #565e7e;
      --color-soft:       #8f94ab;
      --color-rule:       rgba(41,49,79,0.10);
      --color-accent:     #1a4dd9;
      --color-accent-tint: rgba(26,77,217,0.08);
      --color-link:       #1a4dd9;
      --font-sans:     'MiSans', 'Noto Sans SC', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif;
      --font-serif:    'Noto Serif SC', 'Songti SC', 'SimSun', serif;
      --font-mono:     'Sarasa Mono SC', 'Noto Sans SC', ui-monospace, 'SF Mono', Menlo, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-sans);
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.3em;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: 0;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }


    .subtitle {
      font-family: var(--font-sans);
      font-size: 1rem;
      line-height: 1.55;
      color: var(--color-muted);
      max-width: 58ch;
      margin-bottom: 4rem;
    }

    .diagram-container { overflow-x: auto; padding: 2px 0; }

    .cards { display: grid; grid-template-columns: 1.1fr 1fr 0.9fr; gap: 1rem; margin-top: 2rem; }
    @media (max-width: 820px) { .cards { grid-template-columns: 1fr; } }
    .card { background: var(--color-paper); border-radius: 6px; border: 1px solid var(--color-rule); padding: 1.25rem; }
    .card .eyebrow { margin-bottom: 0.5rem; }
    .card-header { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 0.875rem; padding-bottom: 0.875rem; border-bottom: 1px solid rgba(41,49,79,0.10); }
    .card-dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
    .card-dot.accent { background: var(--color-accent); }
    .card-dot.ink { background: var(--color-ink); }
    .card-dot.muted { background: var(--color-muted); }
    .card-dot.soft { background: var(--color-soft); }
    .card h3 { font-size: 0.875rem; font-weight: 600; letter-spacing: 0; }
    .card p, .card ul { color: var(--color-muted); font-size: 0.8125rem; line-height: 1.55; }
    .card ul { list-style: none; margin: 0; padding: 0; }
    .card li { margin-bottom: 0.3rem; padding-left: 0.875rem; position: relative; }
    .card li::before { content: '—'; position: absolute; left: 0; color: rgba(41,49,79,0.20); }

    .footer {
      margin-top: 1rem; padding-top: 1.5rem;
      border-top: 1px solid rgba(41,49,79,0.10);
      font-family: var(--font-mono); font-size: 0.75rem; letter-spacing: 0.06em;
      color: var(--color-soft);
      display: flex; justify-content: space-between; flex-wrap: wrap; gap: 0.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; overflow: visible; }

  <div class="frame">
    <p class="eyebrow">数据团队 · 维恩图</p>
    <h1>数据团队成员画像</h1>
    <p class="subtitle">工程、分析、业务三个能力集合交叠；三环共同交出的甜点位是数据产品负责人（焦点），集合名只放各圆专属的耳叶内。</p>

      <desc id="example-venn-full-desc">维恩图：工程、分析、业务三个能力集合交叠，三环共同交出的甜点位是数据产品负责人（焦点）。</desc>
        <rect width="100%" height="100%" fill="#ffffff"/>

      <defs>
        <!-- 链式裁剪隔离三环公共区：裁到工程，再裁到分析，最后用业务圆填色 -->
        <clipPath id="clip-eng">
          <circle cx="500" cy="140" r="140"/>
        </clipPath>
        <clipPath id="clip-ana">
          <circle cx="428" cy="280" r="140"/>
        </clipPath>
      </defs>

      <circle cx="500" cy="140" r="140" fill="rgba(41,49,79,0.05)"   stroke="#29314f" stroke-width="1"/>
      <circle cx="428" cy="280" r="140" fill="rgba(86,94,126,0.05)"  stroke="#565e7e" stroke-width="1"/>
      <circle cx="572" cy="280" r="140" fill="rgba(143,148,171,0.05)" stroke="#8f94ab" stroke-width="1"/>

      <!-- 焦点：三环公共区填 ink 实色，标签反白 -->
      <g clip-path="url(#clip-eng)">
        <g clip-path="url(#clip-ana)">
          <circle cx="572" cy="280" r="140" fill="#29314f"/>
        </g>
      </g>
