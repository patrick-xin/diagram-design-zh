<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>K8s 数据栈全景 · 全景图</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #ffffff;
      --color-ink:     #29314f;
      --color-muted:   #565e7e;
      --color-accent:  #1a4dd9;
      --font-sans:     'MiSans', 'Noto Sans SC', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif;
      --font-serif:    'Noto Serif SC', 'Songti SC', 'SimSun', serif;
      --font-mono:     'Sarasa Mono SC', 'Noto Sans SC', ui-monospace, 'SF Mono', Menlo, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; padding-left: 4%; }

    .eyebrow {
      font-family: var(--font-sans);
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.3em;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: 0;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 3rem;
    }

    svg { width: 100%; min-width: 900px; display: block; overflow: visible; }
  
.page-nav{display:flex;justify-content:space-between;align-items:center;margin:0 0 1.25rem}
.back-link{font-family:var(--font-sans);font-size:12px;font-weight:500;letter-spacing:0.08em;color:var(--color-muted);text-decoration:none}
.back-link:hover{color:var(--color-accent)}

      <desc id="example-high-level-desc">数据栈全景图：五个阶段（数据源、采集、存储、加工、可视化）横向排开；四个外部源汇入 NiFi 采集，写入 MinIO 对象存储（焦点枢纽）；Trino 对存储做联邦查询，Notebook 加工后与 Trino 查询结果一同交 Superset 出看板；DolphinScheduler 定时触发采集、加工与报表刷新；统一身份（Keycloak · LDAP · OIDC）横贯底部、覆盖全部组件。</desc>

        <marker id="arrow-sm"     markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto"><polygon points="0 0, 6 2.5, 0 5" fill="#565e7e"/></marker>
