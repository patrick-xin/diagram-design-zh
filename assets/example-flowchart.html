<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>线上告警处置 · 流程图</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #ffffff;
      --color-ink:     #29314f;
      --color-muted:   #565e7e;
      --color-soft:    #8f94ab;
      --color-accent:  #1a4dd9;
      --font-sans:     'MiSans', 'Noto Sans SC', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif;
      --font-serif:    'Noto Serif SC', 'Songti SC', 'SimSun', serif;
      --font-mono:     'Sarasa Mono SC', 'Noto Sans SC', ui-monospace, 'SF Mono', Menlo, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; padding-left: 4%; }

    .eyebrow {
      font-family: var(--font-sans);
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.3em;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: 0;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 3rem;
    }

    svg { width: 100%; min-width: 900px; display: block; overflow: visible; }
  
.page-nav{display:flex;justify-content:space-between;align-items:center;margin:0 0 1.25rem}
.back-link{font-family:var(--font-sans);font-size:12px;font-weight:500;letter-spacing:0.08em;color:var(--color-muted);text-decoration:none}
.back-link:hover{color:var(--color-accent)}

    <h1>线上告警怎么处置？</h1>

    <svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="example-flowchart-title example-flowchart-desc">
      <title id="example-flowchart-title">线上告警怎么处置？</title>
      <desc id="example-flowchart-desc">流程图：线上告警后值班确认影响面——核心链路受损且能在 30 分钟内修复时走热修验证（焦点主路径）；链路完好则观察跟进，短时间修不完则立即回滚。</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#565e7e"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1a4dd9"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#ffffff"/>

      <!-- 连接线（先画，全实线——流程图不用虚线） -->
      <line x1="500" y1="48" x2="500" y2="80" stroke="#565e7e" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="500" y1="128" x2="500" y2="152" stroke="#565e7e" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="600" y1="200" x2="720" y2="200" stroke="#565e7e" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="500" y1="248" x2="500" y2="288" stroke="#565e7e" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="600" y1="336" x2="720" y2="336" stroke="#565e7e" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- 主路径（accent）：判断 2 的「是」直下终点 -->
      <line x1="500" y1="384" x2="500" y2="424" stroke="#1a4dd9" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <!-- 分支标签（白底遮罩骑线，断口居中于线段中点） -->
      <rect x="650" y="194" width="20" height="12" rx="2" fill="#ffffff"/>
      <text x="660" y="203" fill="#565e7e" font-size="10" font-weight="500" text-anchor="middle" font-family="'MiSans', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">否</text>

      <rect x="490" y="259" width="20" height="18" rx="2" fill="#ffffff"/>
      <text x="500" y="272" fill="#565e7e" font-size="10" font-weight="500" text-anchor="middle" font-family="'MiSans', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">是</text>

      <rect x="650" y="330" width="20" height="12" rx="2" fill="#ffffff"/>
      <text x="660" y="339" fill="#565e7e" font-size="10" font-weight="500" text-anchor="middle" font-family="'MiSans', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">否</text>

      <rect x="490" y="395" width="20" height="18" rx="2" fill="#ffffff"/>
      <text x="500" y="408" fill="#1a4dd9" font-size="10" font-weight="500" text-anchor="middle" font-family="'MiSans', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">是</text>

      <!-- 起点：胶囊（淡染 + 轻描边） -->
      <rect x="420" y="0" width="160" height="48" rx="24" fill="rgba(41,49,79,0.03)" stroke="rgba(41,49,79,0.30)" stroke-width="1"/>
      <text x="500" y="28" fill="#29314f" font-size="12" font-weight="600" text-anchor="middle" font-family="'MiSans', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">线上告警</text>

      <!-- 步骤：矩形 -->
      <rect x="420" y="80" width="160" height="48" rx="6" fill="#ffffff" stroke="rgba(41,49,79,0.40)" stroke-width="1"/>
      <text x="500" y="108" fill="#29314f" font-size="12" font-weight="600" text-anchor="middle" font-family="'MiSans', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">值班确认影响面</text>

      <!-- 判断 1：菱形 200×96（宽高比 ≈ 2:1） -->
      <polygon points="500,152 600,200 500,248 400,200" fill="#ffffff" stroke="rgba(41,49,79,0.40)" stroke-width="1"/>
      <text x="500" y="196" fill="#29314f" font-size="12" font-weight="600" text-anchor="middle" font-family="'MiSans', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">核心链路</text>
      <text x="500" y="212" fill="#29314f" font-size="12" font-weight="600" text-anchor="middle" font-family="'MiSans', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">受损？</text>

      <!-- 终点：观察（胶囊） -->
      <rect x="720" y="176" width="160" height="48" rx="24" fill="rgba(41,49,79,0.03)" stroke="rgba(41,49,79,0.30)" stroke-width="1"/>
      <text x="800" y="200" fill="#29314f" font-size="12" font-weight="600" text-anchor="middle" font-family="'MiSans', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">观察跟进</text>
      <text x="800" y="214" fill="#565e7e" font-size="10" text-anchor="middle" font-family="'Sarasa Mono SC', ui-monospace, monospace">值班记录 · 例会同步</text>

      <!-- 判断 2：菱形 200×96 -->
      <polygon points="500,288 600,336 500,384 400,336" fill="#ffffff" stroke="rgba(41,49,79,0.40)" stroke-width="1"/>
      <text x="500" y="332" fill="#29314f" font-size="12" font-weight="600" text-anchor="middle" font-family="'MiSans', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">能在 30 分钟</text>
      <text x="500" y="348" fill="#29314f" font-size="12" font-weight="600" text-anchor="middle" font-family="'MiSans', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">内修复？</text>

      <!-- 终点：立即回滚（胶囊） -->
      <rect x="720" y="312" width="160" height="48" rx="24" fill="rgba(41,49,79,0.03)" stroke="rgba(41,49,79,0.30)" stroke-width="1"/>
      <text x="800" y="336" fill="#29314f" font-size="12" font-weight="600" text-anchor="middle" font-family="'MiSans', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">立即回滚</text>
      <text x="800" y="350" fill="#565e7e" font-size="10" text-anchor="middle" font-family="'Sarasa Mono SC', ui-monospace, monospace">先恢复 · 再排查</text>

      <!-- 终点：热修并验证（焦点胶囊，accent） -->
      <rect x="420" y="424" width="160" height="56" rx="28" fill="rgba(26,77,217,0.08)" stroke="#1a4dd9" stroke-width="1.2"/>
      <text x="500" y="452" fill="#29314f" font-size="12" font-weight="600" text-anchor="middle" font-family="'MiSans', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">热修并验证</text>
      <text x="500" y="468" fill="#565e7e" font-size="10" text-anchor="middle" font-family="'Sarasa Mono SC', ui-monospace, monospace">修复 · 复盘</text>
