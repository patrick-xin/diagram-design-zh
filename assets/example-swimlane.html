<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>采购审批流 · 泳道</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #ffffff;
      --color-ink:     #29314f;
      --color-muted:   #565e7e;
      --color-soft:    #8f94ab;
      --color-accent:  #1a4dd9;
      --font-sans:     'MiSans', 'Noto Sans SC', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif;
      --font-serif:    'Noto Serif SC', 'Songti SC', 'SimSun', serif;
      --font-mono:     'Sarasa Mono SC', 'Noto Sans SC', ui-monospace, 'SF Mono', Menlo, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; padding-left: 4%; }

    .eyebrow {
      font-family: var(--font-sans);
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.3em;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: 0;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 3rem;
    }

    svg { width: 100%; min-width: 900px; display: block; overflow: visible; }
  
.page-nav{display:flex;justify-content:space-between;align-items:center;margin:0 0 1.25rem}
.back-link{font-family:var(--font-sans);font-size:12px;font-weight:500;letter-spacing:0.08em;color:var(--color-muted);text-decoration:none}
.back-link:hover{color:var(--color-accent)}

    <p class="eyebrow">采购管理 · 泳道图</p>
    <h1>采购审批流 · 谁在什么时候接手</h1>

    <svg viewBox="0 0 1000 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="example-swimlane-title example-swimlane-desc">
      <title id="example-swimlane-title">采购审批流 · 谁在什么时候接手</title>
      <desc id="example-swimlane-desc">泳道图：申请人、直属主管、财务、采购部四条横向泳道——填写申请单、提交审批后交接给直属主管，主管审批转财务复核，预算核对、核价批准后触发采购部下单，到货签收闭环（焦点终点）。</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#565e7e"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1a4dd9"/></marker>
      </defs>
        <rect width="100%" height="100%" fill="#ffffff"/>

      <!-- 泳道分隔线：外框重、内线轻 -->
      <line x1="0" y1="0" x2="1000" y2="0" stroke="rgba(41,49,79,0.20)" stroke-width="1"/>
      <line x1="0" y1="80" x2="1000" y2="80" stroke="rgba(41,49,79,0.10)" stroke-width="1"/>
      <line x1="0" y1="160" x2="1000" y2="160" stroke="rgba(41,49,79,0.10)" stroke-width="1"/>
      <line x1="0" y1="240" x2="1000" y2="240" stroke="rgba(41,49,79,0.10)" stroke-width="1"/>
      <line x1="0" y1="320" x2="1000" y2="320" stroke="rgba(41,49,79,0.20)" stroke-width="1"/>

      <!-- 角色列分隔线 -->
      <line x1="120" y1="0" x2="120" y2="320" stroke="rgba(41,49,79,0.20)" stroke-width="1"/>

      <!-- 道标签（角色列内） -->
      <text x="20" y="44" fill="#565e7e" font-size="10" font-weight="500" letter-spacing="0.3em" font-family="'MiSans', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">申请人</text>
      <text x="20" y="124" fill="#565e7e" font-size="10" font-weight="500" letter-spacing="0.3em" font-family="'MiSans', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">直属主管</text>
      <text x="20" y="204" fill="#565e7e" font-size="10" font-weight="500" letter-spacing="0.3em" font-family="'MiSans', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">财务</text>
      <text x="20" y="284" fill="#565e7e" font-size="10" font-weight="500" letter-spacing="0.3em" font-family="'MiSans', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">采购部</text>

      <!-- 流转箭头（先画） -->
      <!-- 1. 填写申请单 → 提交审批（道内水平直线） -->
      <line x1="260" y1="40" x2="308" y2="40" stroke="#565e7e" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- 2. 提交审批 → 主管审批（跨道交接，直线斜穿） -->
      <line x1="428" y1="64" x2="476" y2="96" stroke="#565e7e" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- 3. 主管审批 → 预算核对（复核类流转，虚线竖穿） -->
      <line x1="546" y1="144" x2="546" y2="176" stroke="#565e7e" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <!-- 4. 预算核对 → 核价批准（道内水平直线） -->
      <line x1="616" y1="200" x2="668" y2="200" stroke="#565e7e" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- 5. 核价批准 → 采购下单（关键交接，accent 直线斜穿） -->
      <line x1="738" y1="224" x2="708" y2="256" stroke="#1a4dd9" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- 6. 采购下单 → 到货签收（道内水平直线） -->
      <line x1="768" y1="280" x2="800" y2="280" stroke="#565e7e" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- 箭头小签（白底遮罩 + 说明） -->
