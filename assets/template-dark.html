<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>深色模板（中文版）</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    /* 深色档 token——见 style-guide.md 色板「深色档」列与反转规则。深色是 opt-in：
       用户点名深色 / 暗色 / 夜间，或投放目标是深色站点 / 幻灯时才用本模板。 */
    :root {
      --color-paper:   #0a0d1b;
      --color-paper-2: #0a0d1b;   /* 深色下 backend 节点填充（与纸面同色，描边成型） */
      --color-ink:     #e0e4ff;
      --color-muted:   #a2a9ce;
      --color-soft:    rgba(224,228,255,0.72);
      --color-rule:    rgba(224,228,255,0.12);
      --color-accent:  #7d98ff;
      --font-sans:     'MiSans', 'Noto Sans SC', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif;
      --font-serif:    'Noto Serif SC', 'Songti SC', 'SimSun', serif;
      --font-mono:     'Sarasa Mono SC', 'Noto Sans SC', ui-monospace, 'SF Mono', Menlo, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; padding-left: 4%; }

    /* 中文 eyebrow：sans · 12px · 0.3em 字距，无 uppercase */
    .eyebrow {
      font-family: var(--font-sans);
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.3em;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: 0;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 3rem;
    }

    svg { width: 100%; min-width: 900px; display: block; overflow: visible; }

  <div class="frame">
    <p class="eyebrow">对话服务 · 架构图</p>
    <h1>深色模板示例</h1>

    <!-- 产出时把 id 换成 {文件名 slug}-title / -desc（SKILL §7 无障碍契约）。
         下面整段 SVG 是演示内容——复制本模板后替换为你的图。
         深色换档要点：backend 填充 #ffffff → #0a0d1b（与纸面同色，描边成型）；ink 基 rgba 换纸色基 rgba(224,228,255,α)；
         箭头标签遮罩 fill 跟 paper 换 #0a0d1b。见 style-guide.md 换档规则。 -->
    <svg viewBox="0 0 1000 264" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="template-dark-title template-dark-desc">
      <title id="template-dark-title">深色模板示例图</title>
      <desc id="template-dark-desc">深色档模板演示：用户网站经 API 网关到对话 Agent（焦点），Agent 调用 LLM API 并写 Postgres；实际使用时替换为本图内容。</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#a2a9ce"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#7d98ff"/></marker>

      </defs>

      <rect width="100%" height="100%" fill="#0a0d1b"/>

      <!-- 连接线（画在盒子下层） -->
      <line x1="128" y1="176" x2="196" y2="176" stroke="#a2a9ce" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="340" y1="176" x2="412" y2="176" stroke="#7d98ff" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <line x1="572" y1="176" x2="640" y2="176" stroke="#a2a9ce" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Agent → LLM API：顶边出、底边入，正交肘线 r=8 -->
      <path d="M 492,144 V 140 Q 492,132 500,132 H 920 Q 928,132 928,124 V 120"
            fill="none" stroke="#a2a9ce" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- 箭头标签：遮罩 fill 跟 paper 换档 #0a0d1b，6–10px 净空 -->
      <rect x="138" y="156" width="48" height="12" rx="2" fill="#0a0d1b"/>
      <text x="162" y="165" fill="#a2a9ce" font-size="8" font-family="'Sarasa Mono SC', 'Noto Sans SC', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">HTTPS</text>

      <!-- Node: 用户网站（input；深色档 input 填充 = 纸色基 rgba） -->
      <rect x="0" y="144" width="128" height="64" rx="6" fill="#0a0d1b"/>
      <rect x="0" y="144" width="128" height="64" rx="6" fill="rgba(162,169,206,0.08)" stroke="#787fa2" stroke-width="1"/>
      <rect x="8" y="152" width="28" height="12" rx="2" fill="transparent" stroke="rgba(224,228,255,0.40)" stroke-width="0.8"/>
      <text x="22" y="161" fill="#787fa2" font-size="7" font-family="'Sarasa Mono SC', 'Noto Sans SC', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">WEB</text>
      <text x="64" y="180" fill="#e0e4ff" font-size="14" font-weight="600" font-family="'MiSans', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">用户网站</text>
      <text x="64" y="196" fill="#a2a9ce" font-size="9" font-family="'Sarasa Mono SC', 'Noto Sans SC', ui-monospace, monospace" text-anchor="middle">chat widget</text>

      <!-- Node: API 网关（backend；深色档填充与纸面同色 #0a0d1b） -->
      <rect x="196" y="144" width="144" height="64" rx="6" fill="#0a0d1b"/>
      <rect x="196" y="144" width="144" height="64" rx="6" fill="#0a0d1b" stroke="rgba(224,228,255,0.40)" stroke-width="1"/>
