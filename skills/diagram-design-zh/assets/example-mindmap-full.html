<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>短视频账号运营</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      /* full token set */
      --color-paper:      #ffffff;
      --color-paper-2:    #f3f2ff;
      --color-ink:        #29314f;
      --color-muted:      #565e7e;
      --color-soft:       #8f94ab;
      --color-rule:       rgba(41,49,79,0.10);
      --color-accent:     #1a4dd9;
      --color-accent-tint: rgba(26,77,217,0.08);
      --color-link:       #217e7b;
      --font-sans:     'MiSans', 'Noto Sans SC', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif;
      --font-serif:    'Noto Serif SC', 'Songti SC', 'SimSun', serif;
      --font-mono:     'Sarasa Mono SC', 'Noto Sans SC', ui-monospace, 'SF Mono', Menlo, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: var(--font-sans); font-size: 0.75rem; font-weight: 500; letter-spacing: 0.3em; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: 0; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 900px; display: block; overflow: visible; }

    .diagram-container { overflow-x: auto; padding: 2px 0; }

    .cards { display: grid; grid-template-columns: 1.1fr 1fr 0.9fr; gap: 1rem; margin-top: 2rem; }
    @media (max-width: 820px) { .cards { grid-template-columns: 1fr; } }
    .card { background: var(--color-paper); border-radius: 6px; border: 1px solid var(--color-rule); padding: 1.25rem; }
    .card .eyebrow { margin-bottom: 0.5rem; }
    .card-header { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 0.875rem; padding-bottom: 0.875rem; border-bottom: 1px solid rgba(41,49,79,0.10); }
    .card-dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
    .card-dot.accent { background: var(--color-accent); }
    .card-dot.ink { background: var(--color-ink); }
    .card-dot.muted { background: var(--color-muted); }
    .card h3 { font-size: 0.875rem; font-weight: 600; letter-spacing: 0; }
    .card p, .card ul { color: var(--color-muted); font-size: 0.8125rem; line-height: 1.55; }
    .card ul { list-style: none; margin: 0; padding: 0; }
    .card li { margin-bottom: 0.3rem; padding-left: 0.875rem; position: relative; }
    .card li::before { content: '—'; position: absolute; left: 0; color: rgba(41,49,79,0.20); }

    .footer {
      margin-top: 1rem; padding-top: 1.5rem;
      border-top: 1px solid rgba(41,49,79,0.10);
      font-family: var(--font-mono); font-size: 0.75rem; letter-spacing: 0.06em;
      color: var(--color-soft);
      display: flex; justify-content: space-between; flex-wrap: wrap; gap: 0.5rem;
    }

    <div class="cards">
      <div class="card">
        <p class="eyebrow">焦点</p>
        <div class="card-header"><span class="card-dot ink"></span><h3>根胶囊是唯一实色块</h3></div>
        <p>ink 实色胶囊锚在左缘垂直居中带，「账号运营」反白——整张图唯一的非系列色块就是视觉锚，五支从这里向右放射。</p>
      </div>
      <div class="card">
        <p class="eyebrow">读法</p>
        <div class="card-header"><span class="card-dot accent"></span><h3>线宽是层级读数</h3></div>
        <ul>
          <li>连线线宽随深度递减：2 → 1.4 → 1，不靠颜色深浅分层层级</li>
          <li>一级支名用支色，二三级回 ink——色只编码「属于哪一支」</li>
          <li>贝塞尔 S 曲连接，相邻支扇形展开不交叉</li>
        </ul>
      </div>
      <div class="card">
        <p class="eyebrow">口径</p>
        <div class="card-header"><span class="card-dot muted"></span><h3>框架示意，非实测数据</h3></div>
        <p>分支色即分类编码（图例职能，与系列色板同源，非图表类型的合法例外）；五支每组两词的均衡展开是编辑取舍，不携带量级。</p>
      </div>
